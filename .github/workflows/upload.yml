name: CineStream Cloud Torrent & Direct Uploader

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Movie Title'
        required: true
        default: 'Mutiny (2026)'
      magnet:
        description: 'Download Link (Magnet, Direct/Seedr, or M3U8/MPD Stream URL)'
        required: true
      poster:
        description: 'Poster Image URL'
        required: false
        default: 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=800'

jobs:
  cloud_download_and_upload:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Fast Engines
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y aria2 ffmpeg unzip
          pip install telethon cryptg requests yt-dlp

      - name: Process Media Download & Telegram Upload
        env:
          BOT_TOKEN: "8784845752:AAFSX0fkHyALs79xgp8RNs9LExV9LeLyBQs"
          MOVIES_CHANNEL: "-1003984700777"
          THUMBNAILS_CHANNEL: "-1003771325554"
          MOVIE_TITLE: "${{ github.event.inputs.title }}"
          DOWNLOAD_URL: "${{ github.event.inputs.magnet }}"
          POSTER_URL: "${{ github.event.inputs.poster }}"
        run: |
          cat << 'EOF' > uploader.py
          import os, glob, asyncio, subprocess, zipfile, requests
          from telethon import TelegramClient

          API_ID = 31518596
          API_HASH = "450525f29be7392a388c0547e391360f"
          BOT_TOKEN = os.environ["BOT_TOKEN"]
          MOVIES_CHANNEL = int(os.environ["MOVIES_CHANNEL"])
          THUMBNAILS_CHANNEL = int(os.environ["THUMBNAILS_CHANNEL"])
          TITLE = os.environ["MOVIE_TITLE"]
          URI = os.environ["DOWNLOAD_URL"].strip()
          POSTER = os.environ.get("POSTER_URL", "").strip()

          work_dir = "/tmp/movie_temp"
          os.makedirs(work_dir, exist_ok=True)

          print(f"🎬 Starting download for: {TITLE}", flush=True)

          is_stream = (".m3u8" in URI or ".mpd" in URI or "dashstream" in URI or "/hls/" in URI)
          is_magnet = URI.startswith("magnet:?") or URI.startswith("bc://bt/")

          if is_stream:
              print("🌐 [HLS/DASH Stream Detected] Downloading full movie via yt-dlp / ffmpeg engine...", flush=True)
              cmd = [
                  "yt-dlp",
                  "--concurrent-fragments", "16",
                  "--hls-prefer-native",
                  "--no-warnings",
                  "-o", f"{work_dir}/movie.%(ext)s",
                  URI
              ]
              subprocess.run(cmd)

              v_check = glob.glob(f"{work_dir}/**/*.mp4", recursive=True) + glob.glob(f"{work_dir}/**/*.mkv", recursive=True)
              if not v_check:
                  print("🔄 Running ffmpeg direct stream capture...", flush=True)
                  ff_cmd = [
                      "ffmpeg", "-y",
                      "-i", URI,
                      "-c", "copy",
                      "-bsf:a", "aac_adtstoasc",
                      f"{work_dir}/movie.mp4"
                  ]
                  subprocess.run(ff_cmd)

          elif is_magnet:
              print("🧲 [Torrent Magnet Detected] Downloading via aria2c P2P engine...", flush=True)
              trackers = (
                  "&tr=udp://tracker.opentrackr.org:1337/announce"
                  "&tr=udp://open.tracker.cl:1337/announce"
                  "&tr=udp://open.demonii.com:1337/announce"
                  "&tr=udp://tracker.openbittorrent.com:80"
                  "&tr=udp://tracker.coppersurfer.tk:6969"
                  "&tr=udp://glotorrents.pw:6969/announce"
              )
              full_uri = URI + trackers if "&tr=" not in URI else URI
              cmd = [
                  "aria2c",
                  "--enable-dht=true",
                  "--bt-enable-lpd=true",
                  "--enable-peer-exchange=true",
                  "--bt-max-peers=150",
                  "--file-allocation=none",
                  "--seed-time=0",
                  "--summary-interval=5",
                  f"--dir={work_dir}",
                  full_uri
              ]
              subprocess.run(cmd)

          else:
              print("⚡ Detected Direct Link (Seedr / Web URL). Downloading...", flush=True)
              cmd = [
                  "aria2c",
                  "-x16",
                  "-s16",
                  "-k1M",
                  "--summary-interval=5",
                  f"--dir={work_dir}",
                  URI
              ]
              subprocess.run(cmd)

          # Auto-extract zip if present
          zip_files = glob.glob(f"{work_dir}/**/*.zip", recursive=True) + glob.glob(f"{work_dir}/*.zip")
          for zf in zip_files:
              print(f"📦 Extracting Zip Archive: {zf}", flush=True)
              try:
                  with zipfile.ZipFile(zf, "r") as zip_ref:
                      zip_ref.extractall(work_dir)
              except Exception as ze:
                  print(f"Zip extraction note: {ze}", flush=True)

          # ⚡ LIGHTNING FAST 10-SECOND REMUX & ULTRA-FAST CODEC CONVERTER
          def ensure_universal_mp4_playback():
              raw_videos = []
              for ext in ["*.mp4", "*.mkv", "*.avi", "*.webm"]:
                  raw_videos.extend(glob.glob(f"{work_dir}/**/{ext}", recursive=True))

              valid_vids = [f for f in raw_videos if not f.endswith(".mpd") and not f.endswith(".m3u8")]
              if not valid_vids:
                  return None

              largest_vid = max(valid_vids, key=os.path.getsize)
              converted_path = f"{work_dir}/fast_stream_ready.mp4"

              # Check video codec
              probe_cmd = [
                  "ffprobe", "-v", "error",
                  "-select_streams", "v:0",
                  "-show_entries", "stream=codec_name",
                  "-of", "default=noprint_wrappers=1:nokey=1",
                  largest_vid
              ]
              try:
                  codec = subprocess.check_output(probe_cmd).decode().strip().lower()
              except Exception:
                  codec = "unknown"

              print(f"🔍 Video File: {os.path.basename(largest_vid)} (Detected Codec: {codec})", flush=True)

              # 🚀 1. FAST REMUX (තත්පර 5න් සිදුවන Zero-Re-encode Remuxing - 90% Videos)
              if codec in ["h264", "avc", "avc1"]:
                  print("⚡ Lossless Remuxing MKV to Fast MP4 (Takes only 5 seconds)...", flush=True)
                  remux_cmd = [
                      "ffmpeg", "-y",
                      "-i", largest_vid,
                      "-c:v", "copy",
                      "-c:a", "aac",
                      "-movflags", "+faststart",
                      converted_path
                  ]
                  res = subprocess.run(remux_cmd)
                  if res.returncode == 0 and os.path.exists(converted_path):
                      return converted_path

              # 🚀 2. ULTRA-FAST MULTI-THREAD CONVERTER (For HEVC/H.265 only)
              print("⚡ Ultra-Fast Transcoding for HEVC/H.265 (Max Speed)...", flush=True)
              conv_cmd = [
                  "ffmpeg", "-y",
                  "-threads", "0",
                  "-i", largest_vid,
                  "-c:v", "libx264",
                  "-pix_fmt", "yuv420p",
                  "-preset", "ultrafast",
                  "-crf", "24",
                  "-c:a", "aac",
                  "-movflags", "+faststart",
                  converted_path
              ]
              res = subprocess.run(conv_cmd)
              if res.returncode == 0 and os.path.exists(converted_path):
                  return converted_path

              return largest_vid

          # Telethon 2GB MTProto Cloud Upload
          async def upload_to_telegram():
              client = TelegramClient("gh_cloud_session", API_ID, API_HASH)
              await client.start(bot_token=BOT_TOKEN)

              if POSTER and (POSTER.startswith("http://") or POSTER.startswith("https://")):
                  print("🖼️ Uploading Poster...", flush=True)
                  try:
                      await client.send_file(
                          THUMBNAILS_CHANNEL,
                          POSTER,
                          caption=f"🎬 <b>{TITLE}</b>\n🇱🇰 සිංහල උපසිරැසි සහිතයි",
                          parse_mode="html"
                      )
                  except Exception as pe:
                      print(f"Notice on poster: {pe}")

              m_file = ensure_universal_mp4_playback()

              if m_file and os.path.exists(m_file):
                  size_mb = os.path.getsize(m_file) / (1024 * 1024)
                  print(f"🚀 Uploading {size_mb:.2f} MB Movie directly to Telegram Channel...", flush=True)

                  last_pct = -1
                  def progress(current, total):
                      nonlocal last_pct
                      pct = int((current / total) * 100)
                      if pct != last_pct and pct % 5 == 0:
                          last_pct = pct
                          print(f"⚡ Upload: {pct}% ({current/(1024*1024):.1f}MB / {total/(1024*1024):.1f}MB)", flush=True)

                  sent_msg = await client.send_file(
                      MOVIES_CHANNEL,
                      m_file,
                      caption=f"🎥 <b>{TITLE}</b> Full Movie\n🇱🇰 CineStream Official Release",
                      parse_mode="html",
                      supports_streaming=True,
                      progress_callback=progress
                  )
                  print(f"\n🎉 සාර්ථකයි! සම්පූර්ණ චිත්‍රපටයම Telegram Channel එකට Upload විය! (Message ID: {sent_msg.id})", flush=True)

                  # AUTOMATIC FIREBASE REALTIME DATABASE SYNC
                  try:
                      fb_url = "https://cinestream-d5456-default-rtdb.asia-southeast1.firebasedatabase.app/movies.json"
                      res = requests.get(fb_url, timeout=10)
                      if res.status_code == 200 and res.json():
                          movies_dict = res.json()
                          matched_key = None
                          clean_title = TITLE.lower()
                          for k, v in movies_dict.items():
                              if isinstance(v, dict):
                                  m_title = (v.get("title") or "").strip().lower()
                                  if m_title and (m_title in clean_title or clean_title in m_title):
                                      matched_key = k
                                      break
                          if matched_key:
                              patch_url = f"https://cinestream-d5456-default-rtdb.asia-southeast1.firebasedatabase.app/movies/{matched_key}.json"
                              patch_payload = {
                                  "telegramMessageId": str(sent_msg.id),
                                  "directStreamUrl": f"https://sinhalahub-backend.fly.dev/stream/{sent_msg.id}",
                                  "telegramPostUrl": f"https://t.me/cinestream_lk/{sent_msg.id}"
                              }
                              p_res = requests.patch(patch_url, json=patch_payload, timeout=10)
                              print(f"✅ Firebase Realtime Database Updated automatically! Key: {matched_key}, Status: {p_res.status_code}", flush=True)
                          else:
                              print(f"ℹ️ No matching title in Firebase found for {TITLE}", flush=True)
                  except Exception as fbe:
                      print(f"⚠️ Firebase update exception: {fbe}", flush=True)
              else:
                  print("❌ No video file found.", flush=True)

              await client.disconnect()

          asyncio.run(upload_to_telegram())
          EOF

          python uploader.py
