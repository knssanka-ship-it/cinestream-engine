                      video_codec = s.get("codec_name", "").lower()
                  elif s.get("codec_type") == "audio" and not audio_codec:
                      audio_codec = s.get("codec_name", "").lower()
                      if s.get("channels"):
                          try:
                              audio_channels = int(s.get("channels"))
                          except Exception:
                              pass
          except Exception as pe:
              print(f"ffprobe warning: {pe}")

          print(f"📊 Detected -> Video: [{video_codec}], Audio: [{audio_codec}] ({audio_channels} Channels)", flush=True)

          is_v_supported = video_codec in ["h264", "avc1", "hevc", "h265"]
          is_a_aac_stereo = (audio_codec in ["aac", "mp3"]) and (audio_channels <= 2)

          ffmpeg_cmd = ["ffmpeg", "-y", "-i", input_video]

          sub_args = []
          if subtitle_file and os.path.exists(subtitle_file):
              ffmpeg_cmd.extend(["-i", subtitle_file])
              sub_args = [
                  "-c:s", "mov_text",
                  "-metadata:s:s:0", "language=sin",
                  "-metadata:s:s:0", "title=Sinhala",
                  "-map", "0:v:0",
                  "-map", "0:a:0",
                  "-map", "1:s:0"
              ]
          else:
              sub_args = ["-map", "0:v:0", "-map", "0:a:0?"]

          # Condition 1: Already H.264 or HEVC + 2-Channel Stereo AAC + Under 2000MB -> Instant Stream Copy (15 seconds!)
          if is_v_supported and is_a_aac_stereo and input_video.endswith(".mp4") and not subtitle_file and orig_size_mb <= 2000:
              print("⚡ [STREAM COPY]: Video is already H.264/HEVC + Stereo AAC! Instant copy...", flush=True)
              ffmpeg_cmd.extend(["-c", "copy", "-movflags", "+faststart", optimized_video])
          
          # Condition 2: Video is H.264 or HEVC (x265), but Audio has 5.1/7.1 or non-AAC -> Copy video (instant 20s!), convert audio to 2-Channel Stereo AAC
          elif is_v_supported and orig_size_mb <= 2000:
              print(f"⚡ [HIGH-SPEED STREAM COPY]: Video is {video_codec}! Copying video directly (0 quality loss, 20s speed), downmixing Audio to 2-Channel Stereo AAC (-ac 2)...", flush=True)
              ffmpeg_cmd.extend(["-c:v", "copy"])
              if is_a_aac_stereo:
                  ffmpeg_cmd.extend(["-c:a", "copy"])
              else:
                  ffmpeg_cmd.extend(["-c:a", "aac", "-b:a", "160k", "-ac", "2"])
              ffmpeg_cmd.extend(sub_args)
              ffmpeg_cmd.extend(["-movflags", "+faststart", optimized_video])
          
          # Condition 3: Full Re-encode (files > 2000MB or unsupported codecs) -> Fast 1080p Re-encode (veryfast)
          else:
              print("🎬 [TURBO BITRATE RE-ENCODE]: Re-encoding to H.264 with veryfast preset + Standard 2-Channel Stereo AAC...", flush=True)
              ffmpeg_cmd.extend([
                  "-c:v", "libx264",
                  "-preset", "veryfast",
                  "-crf", "23",
                  "-maxrate", "2200k",
                  "-bufsize", "4400k",
                  "-c:a", "aac",
                  "-b:a", "128k",
                  "-ac", "2"
              ])
              ffmpeg_cmd.extend(sub_args)
              ffmpeg_cmd.extend(["-movflags", "+faststart", optimized_video])

          print(f"▶️ Running FFmpeg Optimization...", flush=True)
          ret = subprocess.run(ffmpeg_cmd)

          final_upload_file = optimized_video if (ret.returncode == 0 and os.path.exists(optimized_video)) else input_video
          final_size_mb = os.path.getsize(final_upload_file) / (1024 * 1024)
          print(f"\n✅ Ready for Upload! Final File Size: {final_size_mb:.2f} MB", flush=True)

          # 🎯 4. Upload directly to Telegram Channel via Telethon
          target_id = MOVIE_ID
          direct_stream_url = ""

          async def upload_to_telegram():
              global target_id, direct_stream_url
              print("\n🚀 Connecting to Telegram MTProto API...", flush=True)
              client = TelegramClient(
                  'gh_cloud_session',
                  API_ID,
                  API_HASH,
                  timeout=180,
                  retry_delay=5,
                  connection_retries=10,
                  auto_reconnect=True
              )
              await client.start(bot_token=BOT_TOKEN)

              # Poster Upload
              thumb_msg_id = ""
              if POSTER and (POSTER.startswith("http://") or POSTER.startswith("https://")):
                  try:
                      p_msg = await client.send_file(
                          THUMBNAILS_CHANNEL,
                          POSTER,
                          caption=f"🎬 <b>{TITLE}</b>\n🇱🇰 සිංහල උපසිරැසි සහිතයි | CineStream Movie Hub",
                          parse_mode='html'
                      )
                      thumb_msg_id = str(p_msg.id)
                      print("✅ Poster uploaded!", flush=True)
                  except Exception as pe:
                      print(f"⚠️ Poster note: {pe}")

              # High-Speed Parallel Telegram Upload Engine
              print(f"\n🚀 Uploading {final_size_mb:.2f} MB Movie to Telegram via 8-Thread Parallel MTProto Engine ({MOVIES_CHANNEL})...", flush=True)

              import math, random
              from telethon.tl.types import InputFileBig, DocumentAttributeVideo
              from telethon.tl.functions.upload import SaveBigFilePartRequest

              async def parallel_upload(fpath):
                  fsize = os.path.getsize(fpath)
                  psize = 512 * 1024  # 512 KB chunk
                  tot_parts = math.ceil(fsize / psize)
                  fid = random.getrandbits(63)
                  sem = asyncio.Semaphore(8)
                  sent_bytes = 0

                  async def _up(idx, chk):
                      nonlocal sent_bytes
                      async with sem:
                          for a in range(5):
                              try:
                                  await client(SaveBigFilePartRequest(
                                      file_id=fid,
                                      file_part=idx,
                                      file_total_parts=tot_parts,
                                      bytes=chk
                                  ))
                                  sent_bytes += len(chk)
                                  pct = (sent_bytes / fsize) * 100
                                  cur_mb = sent_bytes / (1024 * 1024)
                                  tot_mb = fsize / (1024 * 1024)
                                  print(f"\r⚡ Telegram Parallel Upload: {pct:.1f}% ({cur_mb:.1f}MB / {tot_mb:.1f}MB)", end="", flush=True)
                                  return
                              except Exception as ex:
                                  if a == 4:
                                      raise ex
                                  await asyncio.sleep(1)

                  up_tasks = []
                  with open(fpath, "rb") as fl:
                      for i in range(tot_parts):
                          c = fl.read(psize)
                          up_tasks.append(_up(i, c))

                  await asyncio.gather(*up_tasks)
                  print("", flush=True)
                  return InputFileBig(id=fid, parts=tot_parts, name=os.path.basename(fpath))

              # Extract video duration, width, height for instant streaming & inline player
              v_duration = 0
              v_w = 1280
              v_h = 720
              try:
                  fp_res = subprocess.run(
                      ["ffprobe", "-v", "error", "-show_entries", "stream=width,height:format=duration", "-of", "json", final_upload_file],
                      stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True
                  )
                  fp_data = json.loads(fp_res.stdout)
                  v_duration = int(float(fp_data.get("format", {}).get("duration", 0)))
                  for st in fp_data.get("streams", []):
                      if st.get("width") and st.get("height"):
                          v_w = int(st.get("width"))
                          v_h = int(st.get("height"))
                          break
              except Exception as pe:
                  print(f"Notice on video attribute probe: {pe}", flush=True)

              video_attrs = [
                  DocumentAttributeVideo(
                      duration=v_duration,
                      w=v_w,
                      h=v_h,
                      supports_streaming=True
                  )
              ]

              # Parallel upload video file
              uploaded_input_file = await parallel_upload(final_upload_file)

              msg = await client.send_file(
                  MOVIES_CHANNEL,
                  uploaded_input_file,
                  caption=f"🎥 <b>{TITLE}</b> Full Movie\n🇱🇰 CineStream Official Release",
                  parse_mode='html',
                  attributes=video_attrs,
                  supports_streaming=True
              )

              # Subtitle file uploads to THUMBNAILS_CHANNEL
              sinhala_sub_msg_id = ""
              if subtitle_file and os.path.exists(subtitle_file):
                  sanitize_and_brand_srt(subtitle_file, is_sinhala=True)
                  try:
                      s_msg = await client.send_file(
                          THUMBNAILS_CHANNEL,
                          subtitle_file,
                          caption=f"📝 <b>{TITLE}</b> Sinhala Subtitle (.srt)\n🇱🇰 Cine Stream Movie Hub කල උපසිරැසි ගැන්මක් | CineStream",
                          parse_mode='html'
                      )
                      sinhala_sub_msg_id = str(s_msg.id)
                      print(f"✅ Sinhala Subtitle uploaded to Thumbnails Channel ({sinhala_sub_msg_id})!", flush=True)
                  except Exception as se:
                      print(f"Subtitle upload note: {se}")

              english_sub_msg_id = ""
              if english_sub_file and os.path.exists(english_sub_file):
                  sanitize_and_brand_srt(english_sub_file, is_sinhala=False)
                  try:
                      e_msg = await client.send_file(
                          THUMBNAILS_CHANNEL,
                          english_sub_file,
                          caption=f"🔤 <b>{TITLE}</b> English Subtitle (.srt)\n⚡ Cine Stream Auto-Subtitles | CineStream",
                          parse_mode='html'
                      )
                      english_sub_msg_id = str(e_msg.id)
                      print(f"✅ English Subtitle uploaded to Thumbnails Channel ({english_sub_msg_id})!", flush=True)
                  except Exception as ee:
                      print(f"English Subtitle upload note: {ee}")

              # 📱 4.5 ENCODE & UPLOAD 480p MOBILE DATA SAVER (400 MB - 600 MB Fast Download)
              msg_480p_id = ""
              file_480p = f"{work_dir}/movie_480p.mp4"
              size_480_str = ""
              try:
                  print("\n📱 [Mobile Saver Engine] Encoding 480p fast-download copy (Target: 400MB - 600MB)...", flush=True)
                  enc_480_cmd = [
                      "ffmpeg", "-y", "-i", final_upload_file,
                      "-vf", "scale=-2:480",
                      "-c:v", "libx264", "-crf", "27", "-preset", "veryfast",
                      "-c:a", "aac", "-b:a", "96k", "-ac", "2",
                      "-movflags", "+faststart",
                      file_480p
                  ]
                  t_start_enc = time.time()
                  enc_proc = subprocess.run(enc_480_cmd, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE, text=True)
                  if enc_proc.returncode == 0 and os.path.exists(file_480p) and os.path.getsize(file_480p) > 5 * 1024 * 1024:
                      f480_bytes = os.path.getsize(file_480p)
                      size_480_mb = f480_bytes / (1024 * 1024)
                      size_480_str = f"{size_480_mb:.0f} MB"
                      print(f"✅ 480p Mobile Saver encoded in {time.time() - t_start_enc:.1f}s! Size: {size_480_str}", flush=True)

                      video_attrs_480p = [
                          DocumentAttributeVideo(
                              duration=v_duration,
                              w=854,
                              h=480,
                              supports_streaming=True
                          )
                      ]
                      uploaded_480p_input = await parallel_upload(file_480p)
                      msg_480p = await client.send_file(
                          MOVIES_CHANNEL,
                          uploaded_480p_input,
                          caption=f"📱 <b>{TITLE}</b> (480p Mobile Data Saver)\n⚡ Fast Download Release ({size_480_str})\n🇱🇰 CineStream Official",
                          parse_mode='html',
                          attributes=video_attrs_480p,
                          supports_streaming=True
                      )
                      msg_480p_id = str(msg_480p.id)
                      print(f"✅ 480p Mobile Saver uploaded! Telegram Msg ID: {msg_480p_id}", flush=True)
                  else:
                      print(f"⚠️ 480p encoding note: {enc_proc.stderr[:160] if enc_proc.stderr else 'skipped'}", flush=True)
              except Exception as enc_e:
                  print(f"⚠️ 480p encoding notice: {enc_e}", flush=True)
              finally:
                  if os.path.exists(file_480p):
                      try:
                          os.remove(file_480p)
                          print("🧹 Temporary 480p file cleaned from disk.", flush=True)
                      except Exception:
                          pass

              chan_clean = str(MOVIES_CHANNEL).replace("-100", "")
              tg_post_url = f"https://t.me/cinestream_lk/{msg.id}"
              direct_stream_url = f"https://sinhalahub-backend.fly.dev/stream/{msg.id}"
              direct_download_480p_url = f"https://sinhalahub-backend.fly.dev/download/{msg_480p_id}" if msg_480p_id else ""

              print("\n\n=======================================================")
              print(f"🎉 සාර්ථකයි! චිත්‍රපටය Telegram Channel එකට සම්පූර්ණයෙන්ම Upload විය!")
              print(f"🔗 Direct Stream Post: {tg_post_url}")
              print(f"🆔 Telegram Message ID: {msg.id}")
              print(f"⚡ Direct Stream URL: {direct_stream_url}")
              if msg_480p_id:
                  print(f"📱 480p Mobile Download Msg ID: {msg_480p_id} ({size_480_str})")
                  print(f"📥 480p Download URL: {direct_download_480p_url}")
              print("=======================================================\n", flush=True)

              # 🎯 5. AUTOMATIC FIREBASE REALTIME DATABASE SYNC
              if RTDB_BASE:
                  print("🔄 [Firebase RTDB Auto-Sync] Updating database...", flush=True)
                  cur_qid = os.environ.get("QUEUE_ID", "").strip()
                  queue_item = None
                  if cur_qid:
                      try:
                          q_snap = requests.get(f"{RTDB_BASE}/queue/{cur_qid}.json", timeout=15)
                          if q_snap.status_code == 200 and q_snap.json():
                              queue_item = q_snap.json()
                      except Exception:
                          pass

                  # 🎬 Check if this is a TV Series Episode
                  is_tv_episode = False
                  series_id = ""
                  season_num = 1
                  ep_num = 1
                  ep_title = ""

                  if queue_item and (queue_item.get("type") == "tv_series_episode" or queue_item.get("seriesId")):
                      is_tv_episode = True
                      series_id = queue_item.get("seriesId", "")
                      season_num = int(queue_item.get("season", 1))
                      ep_num = int(queue_item.get("episode", 1))
                      ep_title = queue_item.get("title", f"Episode {ep_num}")
                  else:
                      match = re.search(r'S(\d+)E(\d+)', TITLE, re.IGNORECASE)
                      if match:
                          is_tv_episode = True
                          season_num = int(match.group(1))
                          ep_num = int(match.group(2))
                          series_title = TITLE.split("-")[0].strip()
                          try:
                              tv_res = requests.get(f"{RTDB_BASE}/tv_series.json", timeout=15)
                              if tv_res.status_code == 200 and tv_res.json():
                                  for sid, sdata in tv_res.json().items():
                                      if isinstance(sdata, dict) and sdata.get("title", "").strip().lower() == series_title.lower():
                                          series_id = sid
                                          break
                          except Exception:
                              pass

                  if is_tv_episode and series_id:
                      try:
                          s_res = requests.get(f"{RTDB_BASE}/tv_series/{series_id}.json", timeout=15)
                          if s_res.status_code == 200 and s_res.json():
                              s_data = s_res.json()
                              seasons = s_data.get("seasons", [])
                              if not seasons or not isinstance(seasons, list):
                                  seasons = [{"seasonNumber": season_num, "title": f"Season {season_num}", "episodes": []}]
                              
                              target_season = None
                              for s in seasons:
                                  if isinstance(s, dict) and s.get("seasonNumber") == season_num:
                                      target_season = s
                                      break
                              if not target_season:
                                  target_season = {"seasonNumber": season_num, "title": f"Season {season_num}", "episodes": []}
                                  seasons.append(target_season)
                              
                              ep_list = target_season.get("episodes", [])
                              if not isinstance(ep_list, list):
                                  ep_list = []
                              
                              ep_payload = {
                                  "id": f"ep_{ep_num}",
                                  "episodeNumber": ep_num,
                                  "title": ep_title or f"Episode {ep_num}",
                                  "name": ep_title or f"Episode {ep_num}",
                                  "streamUrl": direct_stream_url,
                                  "directStreamUrl": direct_stream_url,
                                  "telegramMessageId": str(msg.id),
                                  "telegramPostUrl": tg_post_url,
                                  "status": "ready"
                              }
                              if msg_480p_id:
                                  ep_payload["downloadUrl"] = direct_download_480p_url
                                  ep_payload["downloadUrl480p"] = direct_download_480p_url
                                  ep_payload["telegramDownload480pId"] = str(msg_480p_id)
                                  ep_payload["downloadSize480p"] = size_480_str
                              if sinhala_sub_msg_id:
                                  ep_payload["telegramSubtitleId"] = sinhala_sub_msg_id
                                  ep_payload["subtitleUrl"] = f"https://sinhalahub-backend.fly.dev/stream/{THUMBNAILS_CHANNEL}/{sinhala_sub_msg_id}"
                                  ep_payload["hasSinhalaSub"] = True
                              if english_sub_msg_id:
                                  ep_payload["telegramEnglishSubtitleId"] = english_sub_msg_id
                                  ep_payload["englishSubtitleUrl"] = f"https://sinhalahub-backend.fly.dev/stream/{THUMBNAILS_CHANNEL}/{english_sub_msg_id}"
                                  if not sinhala_sub_msg_id:
                                      ep_payload["subtitleUrl"] = f"https://sinhalahub-backend.fly.dev/stream/{THUMBNAILS_CHANNEL}/{english_sub_msg_id}"
                              
                              existing_idx = -1
                              for idx, ep_item in enumerate(ep_list):
                                  if isinstance(ep_item, dict) and ep_item.get("episodeNumber") == ep_num:
                                      existing_idx = idx
                                      break
                              if existing_idx >= 0:
                                  ep_list[existing_idx] = ep_payload
                              else:
                                  ep_list.append(ep_payload)
                              
                              ep_list.sort(key=lambda x: x.get("episodeNumber", 0))
                              target_season["episodes"] = ep_list
                              
                              save_res = requests.put(
                                  f"{RTDB_BASE}/tv_series/{series_id}/seasons.json",
                                  json=seasons,
                                  timeout=15
                              )
                              if save_res.status_code in [200, 204]:
                                  print(f"🔥 [SUCCESS] Firebase RTDB TV Series ('{s_data.get('title')}') Season {season_num} Episode {ep_num} සාර්ථකව Live Update විය!", flush=True)
                              else:
                                  print(f"⚠️ TV Series update response: {save_res.status_code} - {save_res.text}", flush=True)
                      except Exception as te:
                          print(f"❌ Failed to update TV series in Firebase RTDB: {te}", flush=True)
                  else:
                      # 📽️ Movie update flow
                      target_id = MOVIE_ID
                      if not target_id:
                          try:
                              res = requests.get(f"{RTDB_BASE}/movies.json", timeout=15)
                              if res.status_code == 200 and res.json():
                                  all_m = res.json()
                                  for mid, mdata in all_m.items():
                                      if isinstance(mdata, dict) and mdata.get("title", "").strip().lower() == TITLE.strip().lower():
                                          target_id = mid
                                          print(f"🎯 Matched Movie in Database: {mid} ('{TITLE}')", flush=True)
                                          break
                          except Exception as fe:
                              print(f"⚠️ Search in DB warning: {fe}", flush=True)
                      if target_id:
                          patch_payload = {
                              "telegramMessageId": str(msg.id),
                              "telegramPostUrl": tg_post_url,
                              "directStreamUrl": direct_stream_url,
                          }
                          if msg_480p_id:
                              patch_payload["telegramDownload480pId"] = str(msg_480p_id)
                              patch_payload["downloadUrl480p"] = direct_download_480p_url
                              patch_payload["downloadSize480p"] = size_480_str
                          if sinhala_sub_msg_id:
                              patch_payload["telegramSubtitleId"] = sinhala_sub_msg_id
                              patch_payload["subtitleUrl"] = f"https://sinhalahub-backend.fly.dev/stream/{THUMBNAILS_CHANNEL}/{sinhala_sub_msg_id}"
                              patch_payload["hasSinhalaSub"] = True
                          if english_sub_msg_id:
                              patch_payload["telegramEnglishSubtitleId"] = english_sub_msg_id
                              patch_payload["englishSubtitleUrl"] = f"https://sinhalahub-backend.fly.dev/stream/{THUMBNAILS_CHANNEL}/{english_sub_msg_id}"
                              if not sinhala_sub_msg_id:
                                  patch_payload["subtitleUrl"] = f"https://sinhalahub-backend.fly.dev/stream/{THUMBNAILS_CHANNEL}/{english_sub_msg_id}"
                          try:
                              update_res = requests.patch(
                                  f"{RTDB_BASE}/movies/{target_id}.json",
                                  json=patch_payload,
                                  timeout=15
                              )
                              if update_res.status_code in [200, 204]:
                                  print(f"🔥 [SUCCESS] Firebase Realtime Database ({target_id}) සාර්ථකව Live Update විය!", flush=True)
                              else:
                                  print(f"⚠️ Firebase update response: {update_res.status_code} - {update_res.text}", flush=True)
                          except Exception as pe:
                              print(f"❌ Failed to patch Firebase RTDB: {pe}", flush=True)
                      else:
                          print("ℹ️ Movie ID සොයාගත නොහැකි වූ බැවින් Database update වීම මගහැරිණි.", flush=True)
              await client.disconnect()

          asyncio.run(upload_to_telegram())

          # 🎯 6. AUTOMATIC QUEUE MANAGER & NEXT MOVIE DISPATCH
          RTDB_BASE = os.environ.get("FIREBASE_RTDB_URL", "").rstrip("/")
          if RTDB_BASE:
              try:
                  # If this job was part of a queue, mark this queue item as completed
                  cur_qid = os.environ.get("QUEUE_ID", "").strip()
                  if cur_qid:
                      requests.patch(
                          f"{RTDB_BASE}/queue/{cur_qid}.json",
                          json={"status": "completed", "completedAt": int(time.time()), "streamUrl": direct_stream_url},
                          timeout=15
                      )
                  else:
                      # If no queue_id was provided, check if any queue item matches target_id, title or is processing
                      q_check = requests.get(f"{RTDB_BASE}/queue.json", timeout=15)
                      if q_check.status_code == 200 and q_check.json():
                          for qk, qv in q_check.json().items():
                              if isinstance(qv, dict):
                                  match_id = target_id and qv.get("movieId") == target_id
                                  match_title = qv.get("title", "").strip().lower() == TITLE.strip().lower()
                                  match_proc = qv.get("status") == "processing"
                                  if match_id or match_title or match_proc:
                                      requests.patch(
                                          f"{RTDB_BASE}/queue/{qk}.json",
                                          json={"status": "completed", "completedAt": int(time.time()), "streamUrl": direct_stream_url},
                                          timeout=15
                                      )
                                      print(f"✅ Marked queue item {qk} ('{qv.get('title')}') as completed!", flush=True)
                                      break

                  # Now look for the next movie in queue
                  print("\n=======================================================")
                  print("🔍 [CineStream Queue Manager] Checking for next queued movie...", flush=True)
                  q_res = requests.get(f"{RTDB_BASE}/queue.json", timeout=15)
                  if q_res.status_code == 200 and q_res.json():
                      q_dict = q_res.json()
                      pending_items = []
                      for qk, qv in q_dict.items():
                          if isinstance(qv, dict) and qv.get("status") == "queued":
                              qv["_key"] = qk
                              pending_items.append(qv)

                      if pending_items:
                          # Sort by addedAt ascending (FIFO)
                          pending_items.sort(key=lambda x: x.get("addedAt", 0))
                          next_item = pending_items[0]
                          next_qid = next_item["_key"]
