      - name: 🛑 Cleanup Firebase Queue on Cancellation
        if: cancelled()
        env:
          QUEUE_ID: "${{ github.event.inputs.queue_id }}"
          MOVIE_TITLE: "${{ github.event.inputs.title }}"
          FIREBASE_RTDB_URL: "https://cinestream-d5456-default-rtdb.asia-southeast1.firebasedatabase.app"
        run: |
          python3 -c '
          import os, json, requests
          rtdb = os.environ.get("FIREBASE_RTDB_URL", "").rstrip("/")
          qid = os.environ.get("QUEUE_ID", "").strip()
          title = os.environ.get("MOVIE_TITLE", "").strip()
          print(f"🛑 [Workflow Cancelled] Handling cancellation for queue_id={qid}, title={title}...")
          if rtdb:
              try:
                  if qid:
                      requests.patch(f"{rtdb}/queue/{qid}.json", json={"status": "cancelled", "note": "Cancelled manually via GitHub Actions"}, timeout=10)
                      print(f"✅ Marked queue item {qid} as cancelled in Firebase RTDB.")
                  else:
                      res = requests.get(f"{rtdb}/queue.json", timeout=10)
                      if res.status_code == 200 and res.json():
                          for k, v in res.json().items():
                              if isinstance(v, dict):
                                  if v.get("status") == "processing" and (v.get("title", "").strip().lower() == title.lower() or not title):
                                      requests.patch(f"{rtdb}/queue/{k}.json", json={"status": "cancelled", "note": "Cancelled manually via GitHub Actions"}, timeout=10)
                                      print(f"✅ Marked queue item {k} as cancelled.")
                                      break
              except Exception as e:
                  print(f"⚠️ Failed to update cancellation in RTDB: {e}")
          '

