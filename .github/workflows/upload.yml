name: CineStream Cloud Torrent & Direct Uploader

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Movie Title (චිත්රපටයේ නම)'
        required: true
        default: 'Mutiny (2026)'
      magnet:
        description: 'Download Link (Magnet, Direct MP4/Seedr, or M3U8/MPD Stream URL)'
        required: true
      movie_id:
        description: 'Firebase Movie ID (විකල්පයි - Admin Edit එකෙන් ලැබෙන ID එක)'
        required: false
        default: ''
      poster:
        description: 'Poster Image URL (විකල්පයි)'
        required: false
        default: 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=800'
      subtitle_url:
        description: 'Sinhala Subtitle (.srt) URL (විකල්පයි - උපසිරැසි Direct Link එකක් ඇත්නම්)'
        required: false
        default: ''

jobs:
  cloud_download_and_upload:
    runs-on: ubuntu-latest
    steps:
      - name: 🛠️ Setup Fast Engines & Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y aria2 ffmpeg unzip
          pip install telethon cryptg requests yt-dlp faster-whisper

      - name: 🚀 Media Download, Smart FFmpeg Optimizer & Telegram 2GB Upload
        env:
          BOT_TOKEN: "8784845752:AAFSX0fkHyALs79xgp8RNs9LExV9LeLyBQs"
          MOVIES_CHANNEL: "-1003984700777"
          THUMBNAILS_CHANNEL: "-1003771325554"
          MOVIE_TITLE: "${{ github.event.inputs.title }}"
          DOWNLOAD_URL: "${{ github.event.inputs.magnet }}"
          MOVIE_ID: "${{ github.event.inputs.movie_id }}"
          POSTER_URL: "${{ github.event.inputs.poster }}"
          SUBTITLE_URL: "${{ github.event.inputs.subtitle_url }}"
          FIREBASE_RTDB_URL: "https://cinestream-d5456-default-rtdb.asia-southeast1.firebasedatabase.app"
        run: |
          cat << 'EOF' > uploader.py
          import os, glob, asyncio, subprocess, sys, json, requests
          from telethon import TelegramClient

          API_ID = 31518596
          API_HASH = "450525f29be7392a388c0547e391360f"
          BOT_TOKEN = os.environ["BOT_TOKEN"]
          MOVIES_CHANNEL = int(os.environ["MOVIES_CHANNEL"])
          THUMBNAILS_CHANNEL = int(os.environ["THUMBNAILS_CHANNEL"])
          TITLE = os.environ["MOVIE_TITLE"]
          URI = os.environ["DOWNLOAD_URL"].strip()
          MOVIE_ID = os.environ.get("MOVIE_ID", "").strip()
          POSTER = os.environ.get("POSTER_URL", "").strip()
          SUBTITLE_URL = os.environ.get("SUBTITLE_URL", "").strip()
          RTDB_BASE = os.environ.get("FIREBASE_RTDB_URL", "").rstrip("/")

          work_dir = "/tmp/movie_temp"
          os.makedirs(work_dir, exist_ok=True)

          print(f"🎬 [CineStream Cloud Engine] Starting: '{TITLE}'...", flush=True)

          # 🎯 1. Download Media (Stream / Direct / Magnet)
          is_stream = (".m3u8" in URI or ".mpd" in URI or "dashstream" in URI or "/hls/" in URI)
          is_magnet = URI.startswith("magnet:?") or URI.startswith("bc://bt/")
          is_http = URI.startswith("http://") or URI.startswith("https://")

          if is_http and is_stream:
              print("🌐 [HLS/DASH Stream Detected] Downloading via yt-dlp multi-thread engine...", flush=True)
              raw_file = f"{work_dir}/downloaded_stream.mp4"
              cmd = [
                  "yt-dlp",
                  "--concurrent-fragments", "16",
                  "--hls-prefer-native",
                  "--no-warnings",
                  "-o", raw_file,
                  URI
              ]
              subprocess.run(cmd, check=True)

          elif is_http and not is_magnet:
              print("⚡ [Direct HTTP URL Detected] Downloading via aria2c (16 parallel threads)...", flush=True)
              is_zip = ".zip" in URI.lower() or "get_zip" in URI.lower()
              download_name = "downloaded_archive.zip" if is_zip else "downloaded_direct.mp4"
              cmd = [
                  "aria2c",
                  "-x", "16",
                  "-s", "16",
                  "-j", "16",
                  "--dir=" + work_dir,
                  "-o", download_name,
                  URI
              ]
              subprocess.run(cmd, check=True)

          elif is_magnet or not is_http:
              print("🧲 [Torrent Magnet Detected] Downloading via aria2c High-Speed P2P engine...", flush=True)
              trackers = (
                  "&tr=udp://tracker.opentrackr.org:1337/announce"
                  "&tr=udp://open.tracker.cl:1337/announce"
                  "&tr=udp://open.demonii.com:1337/announce"
                  "&tr=udp://tracker.openbittorrent.com:80"
                  "&tr=udp://tracker.coppersurfer.tk:6969"
                  "&tr=udp://glotorrents.pw:6969/announce"
                  "&tr=udp://p4p.arenabg.com:1337"
                  "&tr=udp://tracker.leechers-paradise.org:6969"
              )
              full_magnet = URI + trackers if "&tr=" not in URI else URI
              cmd = [
                  "aria2c",
                  "--enable-dht=true",
                  "--bt-enable-lpd=true",
                  "--enable-peer-exchange=true",
                  "--bt-max-peers=150",
                  "--file-allocation=none",
                  "--seed-time=0",
                  "--summary-interval=5",
                  "--dir=" + work_dir,
                  full_magnet
              ]
              subprocess.run(cmd, check=True)

          # 🗜️ Check for any ZIP archives (e.g. Seedr Zip downloads) and extract them automatically
          zip_files = glob.glob(f"{work_dir}/**/*.zip", recursive=True)
          for fpath in glob.glob(f"{work_dir}/*"):
              if os.path.isfile(fpath) and fpath not in zip_files:
                  try:
                      with open(fpath, "rb") as test_f:
                          if test_f.read(4) == b"PK\x03\x04":
                              zip_files.append(fpath)
                  except Exception:
                      pass

          for zf in zip_files:
              print(f"📦 [ZIP Archive Detected] Extracting {os.path.basename(zf)}...", flush=True)
              try:
                  import zipfile
                  with zipfile.ZipFile(zf, 'r') as zip_ref:
                      zip_ref.extractall(work_dir)
                  print("✅ ZIP extraction successful!", flush=True)
                  try:
                      os.remove(zf)
                  except Exception:
                      pass
              except Exception as ze:
                  print(f"⚠️ Python zipfile notice: {ze}, trying unzip CLI...", flush=True)
                  subprocess.run(["unzip", "-o", zf, "-d", work_dir])
                  try:
                      os.remove(zf)
                  except Exception:
                      pass

          # Locate downloaded video file
          all_videos = (
              glob.glob(f"{work_dir}/**/*.mp4", recursive=True) +
              glob.glob(f"{work_dir}/**/*.mkv", recursive=True) +
              glob.glob(f"{work_dir}/**/*.webm", recursive=True) +
              glob.glob(f"{work_dir}/**/*.avi", recursive=True)
          )

          if not all_videos:
              print("❌ Error: No video file found after download!", flush=True)
              sys.exit(1)

          input_video = max(all_videos, key=os.path.getsize)
          orig_size_mb = os.path.getsize(input_video) / (1024 * 1024)
          print(f"\n📦 Downloaded Video File: {os.path.basename(input_video)} ({orig_size_mb:.2f} MB)", flush=True)

          # 🎯 2. Download Sinhala Subtitle if provided
          subtitle_file = None
          if SUBTITLE_URL:
              print(f"📝 Fetching Sinhala Subtitles from: {SUBTITLE_URL}...", flush=True)
              try:
                  sub_res = requests.get(SUBTITLE_URL, timeout=30)
                  if sub_res.status_code == 200:
                      subtitle_file = f"{work_dir}/sinhala_sub.srt"
                      with open(subtitle_file, "wb") as sf:
                          sf.write(sub_res.content)
                      print(f"✅ Sinhala Subtitle saved: {subtitle_file}", flush=True)
              except Exception as se:
                  print(f"⚠️ Subtitle notice: {se}")

          # 🎯 2.1 Check for Embedded English Subtitles or Generate via 100% Free Faster-Whisper AI
          english_sub_file = None
          print("🔍 Checking for embedded English subtitles in input file...", flush=True)
          sub_probe = subprocess.run(
              ["ffprobe", "-v", "error", "-show_entries", "stream=index,codec_name:stream_tags=language,title", "-select_streams", "s", "-of", "json", input_video],
              stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True
          )
          embedded_sub_idx = None
          try:
              s_data = json.loads(sub_probe.stdout)
              for st in s_data.get("streams", []):
                  lang = st.get("tags", {}).get("language", "").lower()
                  title_tag = st.get("tags", {}).get("title", "").lower()
                  if "eng" in lang or "en" in lang or "english" in title_tag:
                      embedded_sub_idx = st.get("index")
                      break
                  elif embedded_sub_idx is None:
                      embedded_sub_idx = st.get("index")
          except Exception as spe:
              print(f"Notice on subtitle probe: {spe}")

          if embedded_sub_idx is not None:
              print(f"⚡ [INSTANT SUBTITLE EXTRACTION] Found embedded subtitle track (stream #{embedded_sub_idx})! Extracting to .srt (1s)...", flush=True)
              extracted_sub = f"{work_dir}/english_sub.srt"
              ext_res = subprocess.run(["ffmpeg", "-y", "-i", input_video, "-map", f"0:{embedded_sub_idx}", extracted_sub], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              if ext_res.returncode == 0 and os.path.exists(extracted_sub) and os.path.getsize(extracted_sub) > 100:
                  english_sub_file = extracted_sub
                  print(f"✅ Extracted official English Subtitle ({os.path.getsize(english_sub_file)/1024:.1f} KB)!", flush=True)

          # If no embedded subtitle, generate using 100% Free Faster-Whisper on GitHub CPU (0 Tokens, 0 Cost)
          if not english_sub_file:
              print("🤖 [AI AUTO-SUBTITLES] Generating English Subtitles via Free Local Faster-Whisper AI...", flush=True)
              try:
                  speech_audio = f"{work_dir}/speech_16k.wav"
                  # Extract lightweight 16kHz mono audio for Whisper in 2 seconds
                  subprocess.run([
                      "ffmpeg", "-y", "-i", input_video,
                      "-vn", "-acodec", "pcm_s16le", "-ar", "16000", "-ac", "1",
                      speech_audio
                  ], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)

                  if os.path.exists(speech_audio):
                      from faster_whisper import WhisperModel
                      print("🧠 Loading Faster-Whisper base.en model (100% Free, Unlimited, 0 Tokens)...", flush=True)
                      model = WhisperModel("base.en", device="cpu", compute_type="int8")
                      segments, info = model.transcribe(speech_audio, beam_size=1, language="en")

                      gen_sub = f"{work_dir}/english_ai_sub.srt"
                      with open(gen_sub, "w", encoding="utf-8") as sf:
                          s_idx = 1
                          for seg in segments:
                              s_h, s_m = int(seg.start // 3600), int((seg.start % 3600) // 60)
                              s_s, s_ms = int(seg.start % 60), int((seg.start - int(seg.start)) * 1000)
                              e_h, e_m = int(seg.end // 3600), int((seg.end % 3600) // 60)
                              e_s, e_ms = int(seg.end % 60), int((seg.end - int(seg.end)) * 1000)
                              t_start = f"{s_h:02d}:{s_m:02d}:{s_s:02d},{s_ms:03d}"
                              t_end = f"{e_h:02d}:{e_m:02d}:{e_s:02d},{e_ms:03d}"
                              txt = seg.text.strip()
                              if txt:
                                  sf.write(f"{s_idx}\n{t_start} --> {t_end}\n{txt}\n\n")
                                  s_idx += 1

                      if os.path.exists(gen_sub) and os.path.getsize(gen_sub) > 100:
                          english_sub_file = gen_sub
                          print(f"✅ AI Auto-Generated English Subtitles successfully ({s_idx} lines)!", flush=True)
                      try:
                          os.remove(speech_audio)
                      except Exception:
                          pass
              except Exception as w_err:
                  print(f"⚠️ Faster-Whisper notice: {w_err}", flush=True)

          # 🎯 3. Smart Video & Audio Optimization (Ultra-Fast 20s Engine)
          optimized_video = f"{work_dir}/cinestream_final.mp4"

          print("\n🔍 Analyzing video codecs and audio channels with ffprobe...", flush=True)
          probe_cmd = [
              "ffprobe", "-v", "error",
              "-show_entries", "stream=index,codec_type,codec_name,channels",
              "-of", "json", input_video
          ]
          probe_res = subprocess.run(probe_cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
          video_codec = ""
          audio_codec = ""
          audio_channels = 2
          try:
              data = json.loads(probe_res.stdout)
              for s in data.get("streams", []):
                  if s.get("codec_type") == "video" and not video_codec:
                      video_codec = s.get("codec_name", "").lower()
                  elif s.get("codec_type") == "audio" and not audio_codec:
                      audio_codec = s.get("codec_name", "").lower()
                      if s.get("channels"):
                          try:
                              audio_channels = int(s.get("channels"))
                          except Exception:
                              pass
          except Exception as pe:
              print(f"ffprobe warning: {pe}")

          print(f"📊 Detected -> Video: [{video_codec}], Audio: [{audio_codec}] ({audio_channels} Channels)", flush=True)

          is_v_supported = video_codec in ["h264", "avc1", "hevc", "h265"]
          is_a_aac_stereo = (audio_codec in ["aac", "mp3"]) and (audio_channels <= 2)

          ffmpeg_cmd = ["ffmpeg", "-y", "-i", input_video]

          sub_args = []
          if subtitle_file and os.path.exists(subtitle_file):
              ffmpeg_cmd.extend(["-i", subtitle_file])
              sub_args = [
                  "-c:s", "mov_text",
                  "-metadata:s:s:0", "language=sin",
                  "-metadata:s:s:0", "title=Sinhala",
                  "-map", "0:v:0",
                  "-map", "0:a:0",
                  "-map", "1:s:0"
              ]
          else:
              sub_args = ["-map", "0:v:0", "-map", "0:a:0?"]

          # Condition 1: Already H.264/HEVC + 2-Channel Stereo AAC + Under 2000MB -> Instant Stream Copy (15s)
          if is_v_supported and is_a_aac_stereo and input_video.endswith(".mp4") and not subtitle_file and orig_size_mb <= 2000:
              print("⚡ [STREAM COPY]: Video is already H.264/HEVC + Stereo AAC! Instant copy...", flush=True)
              ffmpeg_cmd.extend(["-c", "copy", "-movflags", "+faststart", optimized_video])
          
          # Condition 2: Video is H.264 or HEVC (x265), but Audio has 5.1/7.1 -> Copy video (instant 20s!), downmix Audio to 2-Channel Stereo AAC
          elif is_v_supported and orig_size_mb <= 2000:
              print(f"⚡ [HIGH-SPEED STREAM COPY]: Video is {video_codec}! Copying video directly (0 quality loss, 20s speed), downmixing Audio to 2-Channel Stereo AAC (-ac 2)...", flush=True)
              ffmpeg_cmd.extend(["-c:v", "copy"])
              if is_a_aac_stereo:
                  ffmpeg_cmd.extend(["-c:a", "copy"])
              else:
                  ffmpeg_cmd.extend(["-c:a", "aac", "-b:a", "160k", "-ac", "2"])
              ffmpeg_cmd.extend(sub_args)
              ffmpeg_cmd.extend(["-movflags", "+faststart", optimized_video])
          
          # Condition 3: Full Re-encode (files > 2000MB or unsupported codecs) -> Fast 1080p Re-encode (veryfast)
          else:
              print("🎬 [TURBO BITRATE RE-ENCODE]: Re-encoding to H.264 with veryfast preset + Standard 2-Channel Stereo AAC...", flush=True)
              ffmpeg_cmd.extend([
                  "-c:v", "libx264",
                  "-preset", "veryfast",
                  "-crf", "23",
                  "-maxrate", "2200k",
                  "-bufsize", "4400k",
                  "-c:a", "aac",
                  "-b:a", "128k",
                  "-ac", "2"
              ])
              ffmpeg_cmd.extend(sub_args)
              ffmpeg_cmd.extend(["-movflags", "+faststart", optimized_video])

          print(f"▶️ Running FFmpeg Optimization...", flush=True)
          ret = subprocess.run(ffmpeg_cmd)

          final_upload_file = optimized_video if (ret.returncode == 0 and os.path.exists(optimized_video)) else input_video
          final_size_mb = os.path.getsize(final_upload_file) / (1024 * 1024)
          print(f"\n✅ Ready for Upload! Final File Size: {final_size_mb:.2f} MB", flush=True)

          # 🎯 4. Upload directly to Telegram Channel via Telethon (8-Thread Parallel Engine)
          async def upload_to_telegram():
              print("\n🚀 Connecting to Telegram MTProto API...", flush=True)
              client = TelegramClient(
                  'gh_cloud_session',
                  API_ID,
                  API_HASH,
                  timeout=180,
                  retry_delay=5,
                  connection_retries=10,
                  auto_reconnect=True
              )
              await client.start(bot_token=BOT_TOKEN)

              # Poster Upload
              thumb_msg_id = ""
              if POSTER and (POSTER.startswith("http://") or POSTER.startswith("https://")):
                  try:
                      p_msg = await client.send_file(
                          THUMBNAILS_CHANNEL,
                          POSTER,
                          caption=f"🎬 <b>{TITLE}</b>\n🇱🇰 සිංහල උපසිරැසි සහිතයි | CineStream Movie Hub",
                          parse_mode='html'
                      )
                      thumb_msg_id = str(p_msg.id)
                      print("✅ Poster uploaded!", flush=True)
                  except Exception as pe:
                      print(f"⚠️ Poster note: {pe}")

              # High-Speed Parallel Telegram Upload Engine
              print(f"\n🚀 Uploading {final_size_mb:.2f} MB Movie to Telegram via 8-Thread Parallel MTProto Engine ({MOVIES_CHANNEL})...", flush=True)

              import math, random
              from telethon.tl.types import InputFileBig, DocumentAttributeVideo
              from telethon.tl.functions.upload import SaveBigFilePartRequest

              async def parallel_upload(fpath):
                  fsize = os.path.getsize(fpath)
                  psize = 512 * 1024  # 512 KB chunk
                  tot_parts = math.ceil(fsize / psize)
                  fid = random.getrandbits(63)
                  sem = asyncio.Semaphore(8)
                  sent_bytes = 0

                  async def _up(idx, chk):
                      nonlocal sent_bytes
                      async with sem:
                          for a in range(5):
                              try:
                                  await client(SaveBigFilePartRequest(
                                      file_id=fid,
                                      file_part=idx,
                                      file_total_parts=tot_parts,
                                      bytes=chk
                                  ))
                                  sent_bytes += len(chk)
                                  pct = (sent_bytes / fsize) * 100
                                  cur_mb = sent_bytes / (1024 * 1024)
                                  tot_mb = fsize / (1024 * 1024)
                                  print(f"\r⚡ Telegram Parallel Upload: {pct:.1f}% ({cur_mb:.1f}MB / {tot_mb:.1f}MB)", end="", flush=True)
                                  return
                              except Exception as ex:
                                  if a == 4:
                                      raise ex
                                  await asyncio.sleep(1)

                  up_tasks = []
                  with open(fpath, "rb") as fl:
                      for i in range(tot_parts):
                          c = fl.read(psize)
                          up_tasks.append(_up(i, c))

                  await asyncio.gather(*up_tasks)
                  print("", flush=True)
                  return InputFileBig(id=fid, parts=tot_parts, name=os.path.basename(fpath))

              # Extract video duration, width, height for instant streaming & inline player
              v_duration = 0
              v_w = 1280
              v_h = 720
              try:
                  fp_res = subprocess.run(
                      ["ffprobe", "-v", "error", "-show_entries", "stream=width,height:format=duration", "-of", "json", final_upload_file],
                      stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True
                  )
                  fp_data = json.loads(fp_res.stdout)
                  v_duration = int(float(fp_data.get("format", {}).get("duration", 0)))
                  for st in fp_data.get("streams", []):
                      if st.get("width") and st.get("height"):
                          v_w = int(st.get("width"))
                          v_h = int(st.get("height"))
                          break
              except Exception as pe:
                  print(f"Notice on video attribute probe: {pe}", flush=True)

              video_attrs = [
                  DocumentAttributeVideo(
                      duration=v_duration,
                      w=v_w,
                      h=v_h,
                      supports_streaming=True
                  )
              ]

              # Parallel upload video file (High-Speed Multi-connection)
              uploaded_input_file = await parallel_upload(final_upload_file)

              msg = await client.send_file(
                  MOVIES_CHANNEL,
                  uploaded_input_file,
                  caption=f"🎥 <b>{TITLE}</b> Full Movie\n🇱🇰 CineStream Official Release",
                  parse_mode='html',
                  attributes=video_attrs,
                  supports_streaming=True
              )

              # Subtitle file uploads to THUMBNAILS_CHANNEL
              sinhala_sub_msg_id = ""
              if subtitle_file and os.path.exists(subtitle_file):
                  try:
                      s_msg = await client.send_file(
                          THUMBNAILS_CHANNEL,
                          subtitle_file,
                          caption=f"📝 <b>{TITLE}</b> Sinhala Subtitle (.srt)\n🇱🇰 සිංහල උපසිරැසි ගොනුව",
                          parse_mode='html'
                      )
                      sinhala_sub_msg_id = str(s_msg.id)
                      print(f"✅ Sinhala Subtitle uploaded to Thumbnails Channel ({sinhala_sub_msg_id})!", flush=True)
                  except Exception as se:
                      print(f"Subtitle upload note: {se}")

              english_sub_msg_id = ""
              if english_sub_file and os.path.exists(english_sub_file):
                  try:
                      e_msg = await client.send_file(
                          THUMBNAILS_CHANNEL,
                          english_sub_file,
                          caption=f"🔤 <b>{TITLE}</b> English Subtitle (.srt)\n⚡ CineStream Auto-Subtitles",
                          parse_mode='html'
                      )
                      english_sub_msg_id = str(e_msg.id)
                      print(f"✅ English Subtitle uploaded to Thumbnails Channel ({english_sub_msg_id})!", flush=True)
                  except Exception as ee:
                      print(f"English Subtitle upload note: {ee}")

              chan_clean = str(MOVIES_CHANNEL).replace("-100", "")
              tg_post_url = f"https://t.me/cinestream_lk/{msg.id}"
              direct_stream_url = f"https://sinhalahub-backend.fly.dev/stream/{msg.id}"

              print("\n\n=======================================================")
              print(f"🎉 සාර්ථකයි! චිත්‍රපටය Telegram Channel එකට සම්පූර්ණයෙන්ම Upload විය!")
              print(f"🔗 Direct Stream Post: {tg_post_url}")
              print(f"🆔 Telegram Message ID: {msg.id}")
              print(f"⚡ Direct Stream URL: {direct_stream_url}")
              print("=======================================================\n", flush=True)

              # 🎯 5. AUTOMATIC FIREBASE REALTIME DATABASE SYNC
              if RTDB_BASE:
                  print("🔄 [Firebase RTDB Auto-Sync] Updating database...", flush=True)
                  target_id = MOVIE_ID

                  if not target_id:
                      try:
                          res = requests.get(f"{RTDB_BASE}/movies.json", timeout=15)
                          if res.status_code == 200 and res.json():
                              all_m = res.json()
                              for mid, mdata in all_m.items():
                                  if isinstance(mdata, dict) and mdata.get("title", "").strip().lower() == TITLE.strip().lower():
                                      target_id = mid
                                      print(f"🎯 Matched Movie in Database: {mid} ('{TITLE}')", flush=True)
                                      break
                      except Exception as fe:
                          print(f"⚠️ Search in DB warning: {fe}", flush=True)

                  if target_id:
                      patch_payload = {
                          "telegramMessageId": str(msg.id),
                          "telegramPostUrl": tg_post_url,
                          "directStreamUrl": direct_stream_url,
                      }
                      if sinhala_sub_msg_id:
                          patch_payload["telegramSubtitleId"] = sinhala_sub_msg_id
                          patch_payload["subtitleUrl"] = f"https://sinhalahub-backend.fly.dev/stream/{THUMBNAILS_CHANNEL}/{sinhala_sub_msg_id}"
                          patch_payload["hasSinhalaSub"] = True

                      if english_sub_msg_id:
                          patch_payload["telegramEnglishSubtitleId"] = english_sub_msg_id
                          patch_payload["englishSubtitleUrl"] = f"https://sinhalahub-backend.fly.dev/stream/{THUMBNAILS_CHANNEL}/{english_sub_msg_id}"
                          if not sinhala_sub_msg_id:
                              patch_payload["subtitleUrl"] = f"https://sinhalahub-backend.fly.dev/stream/{THUMBNAILS_CHANNEL}/{english_sub_msg_id}"

                      try:
                          update_res = requests.patch(
                              f"{RTDB_BASE}/movies/{target_id}.json",
                              json=patch_payload,
                              timeout=15
                          )
                          if update_res.status_code in [200, 204]:
                              print(f"🔥 [SUCCESS] Firebase Realtime Database ({target_id}) සාර්ථකව Live Update විය!", flush=True)
                          else:
                              print(f"⚠️ Firebase update response: {update_res.status_code} - {update_res.text}", flush=True)
                      except Exception as pe:
                          print(f"❌ Failed to patch Firebase RTDB: {pe}", flush=True)
                  else:
                      print("ℹ️ Movie ID සොයාගත නොහැකි වූ බැවින් Database update වීම මගහැරිණි.", flush=True)

              await client.disconnect()

          asyncio.run(upload_to_telegram())
          EOF
          python uploader.py
