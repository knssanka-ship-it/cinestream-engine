name: CineStream Cloud Torrent & Direct Uploader

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Movie Title (චිත්‍රපටයේ නම)'
        required: true
        default: 'Mutiny (2026)'
      magnet:
        description: 'Download Link (Magnet, Direct MP4/Seedr, or M3U8/MPD Stream URL)'
        required: true
      poster:
        description: 'Poster Image URL (විකල්පයි)'
        required: false
        default: 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=800'
      subtitle_url:
        description: 'Sinhala Subtitle (.srt) URL (විකල්පයි - උපසිරැසි Direct Link එකක් ඇත්නම්)'
        required: false
        default: ''

jobs:
  cloud_download_and_upload:
    runs-on: ubuntu-latest
    steps:
      - name: 🛠️ Setup Fast Engines & Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y aria2 ffmpeg
          pip install telethon cryptg requests yt-dlp

      - name: 🚀 Media Download, Smart FFmpeg Optimizer & Telegram 2GB Upload
        env:
          BOT_TOKEN: "8784845752:AAFSX0fkHyALs79xgp8RNs9LExV9LeLyBQs"
          MOVIES_CHANNEL: "-1003984700777"
          THUMBNAILS_CHANNEL: "-1003771325554"
          MOVIE_TITLE: "${{ github.event.inputs.title }}"
          DOWNLOAD_URL: "${{ github.event.inputs.magnet }}"
          POSTER_URL: "${{ github.event.inputs.poster }}"
          SUBTITLE_URL: "${{ github.event.inputs.subtitle_url }}"
        run: |
          cat << 'EOF' > uploader.py
          import os, glob, asyncio, subprocess, sys, json, requests
          from telethon import TelegramClient

          API_ID = 31518596
          API_HASH = "450525f29be7392a388c0547e391360f"
          BOT_TOKEN = os.environ["BOT_TOKEN"]
          MOVIES_CHANNEL = int(os.environ["MOVIES_CHANNEL"])
          THUMBNAILS_CHANNEL = int(os.environ["THUMBNAILS_CHANNEL"])
          TITLE = os.environ["MOVIE_TITLE"]
          URI = os.environ["DOWNLOAD_URL"].strip()
          POSTER = os.environ.get("POSTER_URL", "").strip()
          SUBTITLE_URL = os.environ.get("SUBTITLE_URL", "").strip()

          work_dir = "/tmp/movie_temp"
          os.makedirs(work_dir, exist_ok=True)

          print(f"🎬 [CineStream Cloud Engine] Starting: '{TITLE}'...", flush=True)

          # 🎯 1. Download Media (Stream / Direct / Magnet)
          is_stream = (".m3u8" in URI or ".mpd" in URI or "dashstream" in URI or "/hls/" in URI)
          is_magnet = URI.startswith("magnet:?") or URI.startswith("bc://bt/")
          is_http = URI.startswith("http://") or URI.startswith("https://")

          if is_http and is_stream:
              print("🌐 [HLS/DASH Stream Detected] Downloading via yt-dlp multi-thread engine...", flush=True)
              raw_file = f"{work_dir}/downloaded_stream.mp4"
              cmd = [
                  "yt-dlp",
                  "--concurrent-fragments", "16",
                  "--hls-prefer-native",
                  "--no-warnings",
                  "-o", raw_file,
                  URI
              ]
              subprocess.run(cmd, check=True)

          elif is_http and not is_magnet:
              print("⚡ [Direct HTTP URL Detected] Downloading via aria2c (16 parallel threads)...", flush=True)
              cmd = [
                  "aria2c",
                  "-x", "16",
                  "-s", "16",
                  "-j", "16",
                  "--dir=" + work_dir,
                  "-o", "downloaded_direct.mp4",
                  URI
              ]
              subprocess.run(cmd, check=True)

          elif is_magnet or not is_http:
              print("🧲 [Torrent Magnet Detected] Downloading via aria2c High-Speed P2P engine...", flush=True)
              trackers = (
                  "&tr=udp://tracker.opentrackr.org:1337/announce"
                  "&tr=udp://open.tracker.cl:1337/announce"
                  "&tr=udp://open.demonii.com:1337/announce"
                  "&tr=udp://tracker.openbittorrent.com:80"
                  "&tr=udp://tracker.coppersurfer.tk:6969"
                  "&tr=udp://glotorrents.pw:6969/announce"
                  "&tr=udp://p4p.arenabg.com:1337"
                  "&tr=udp://tracker.leechers-paradise.org:6969"
              )
              full_magnet = URI + trackers if "&tr=" not in URI else URI
              cmd = [
                  "aria2c",
                  "--enable-dht=true",
                  "--bt-enable-lpd=true",
                  "--enable-peer-exchange=true",
                  "--bt-max-peers=150",
                  "--file-allocation=none",
                  "--seed-time=0",
                  "--summary-interval=5",
                  "--dir=" + work_dir,
                  full_magnet
              ]
              subprocess.run(cmd, check=True)

          # Locate downloaded video file
          all_videos = (
              glob.glob(f"{work_dir}/**/*.mp4", recursive=True) +
              glob.glob(f"{work_dir}/**/*.mkv", recursive=True) +
              glob.glob(f"{work_dir}/**/*.webm", recursive=True) +
              glob.glob(f"{work_dir}/**/*.avi", recursive=True)
          )

          if not all_videos:
              print("❌ Error: No video file found after download!", flush=True)
              sys.exit(1)

          input_video = max(all_videos, key=os.path.getsize)
          orig_size_mb = os.path.getsize(input_video) / (1024 * 1024)
          print(f"\n📦 Downloaded Video File: {os.path.basename(input_video)} ({orig_size_mb:.2f} MB)", flush=True)

          # 🎯 2. Download Sinhala Subtitle if provided
          subtitle_file = None
          if SUBTITLE_URL:
              print(f"📝 Fetching Sinhala Subtitles from: {SUBTITLE_URL}...", flush=True)
              try:
                  sub_res = requests.get(SUBTITLE_URL, timeout=30)
                  if sub_res.status_code == 200:
                      subtitle_file = f"{work_dir}/sinhala_sub.srt"
                      with open(subtitle_file, "wb") as sf:
                          sf.write(sub_res.content)
                      print(f"✅ Sinhala Subtitle saved: {subtitle_file}", flush=True)
              except Exception as se:
                  print(f"⚠️ Subtitle notice: {se}")

          # 🎯 3. Smart Video Optimization
          optimized_video = f"{work_dir}/cinestream_final.mp4"

          print("\n🔍 Analyzing video codecs with ffprobe...", flush=True)
          probe_cmd = [
              "ffprobe", "-v", "error",
              "-show_entries", "stream=index,codec_type,codec_name",
              "-of", "json", input_video
          ]
          probe_res = subprocess.run(probe_cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
          video_codec = ""
          audio_codec = ""
          try:
              data = json.loads(probe_res.stdout)
              for s in data.get("streams", []):
                  if s.get("codec_type") == "video" and not video_codec:
                      video_codec = s.get("codec_name", "").lower()
                  elif s.get("codec_type") == "audio" and not audio_codec:
                      audio_codec = s.get("codec_name", "").lower()
          except Exception as pe:
              print(f"ffprobe warning: {pe}")

          print(f"📊 Detected -> Video: [{video_codec}], Audio: [{audio_codec}]", flush=True)

          is_v_h264 = video_codec in ["h264", "avc1"]
          is_a_aac = audio_codec in ["aac", "mp3"]

          ffmpeg_cmd = ["ffmpeg", "-y", "-i", input_video]

          sub_args = []
          if subtitle_file and os.path.exists(subtitle_file):
              ffmpeg_cmd.extend(["-i", subtitle_file])
              sub_args = [
                  "-c:s", "mov_text",
                  "-metadata:s:s:0", "language=sin",
                  "-metadata:s:s:0", "title=Sinhala",
                  "-map", "0:v:0",
                  "-map", "0:a:0",
                  "-map", "1:s:0"
              ]
          else:
              sub_args = ["-map", "0:v:0", "-map", "0:a:0?"]

          if is_v_h264 and is_a_aac and input_video.endswith(".mp4") and not subtitle_file and orig_size_mb <= 2000:
              print("⚡ [STREAM COPY]: File is already MP4 H.264 + AAC! Keeping original 1.45 GB file (0 MB increase)...", flush=True)
              ffmpeg_cmd.extend(["-c", "copy", "-movflags", "+faststart", optimized_video])
          elif is_v_h264 and orig_size_mb <= 2000:
              print("⚡ [STREAM COPY]: Video is H.264! Copying video without re-encoding (100x speed, 0 quality loss, size stays identical!)...", flush=True)
              ffmpeg_cmd.extend(["-c:v", "copy"])
              if is_a_aac:
                  ffmpeg_cmd.extend(["-c:a", "copy"])
              else:
                  ffmpeg_cmd.extend(["-c:a", "aac", "-b:a", "160k"])
              ffmpeg_cmd.extend(sub_args)
              ffmpeg_cmd.extend(["-movflags", "+faststart", optimized_video])
          else:
              print("🎬 [SMART BITRATE RE-ENCODE]: Video is H.265/HEVC. Re-encoding with strict 2.2 Mbps bitrate cap (guaranteed < 1.6 GB)...", flush=True)
              ffmpeg_cmd.extend([
                  "-c:v", "libx264",
                  "-preset", "faster",
                  "-crf", "23",
                  "-maxrate", "2200k",
                  "-bufsize", "4400k",
                  "-c:a", "aac",
                  "-b:a", "128k"
              ])
              ffmpeg_cmd.extend(sub_args)
              ffmpeg_cmd.extend(["-movflags", "+faststart", optimized_video])

          print(f"▶️ Running FFmpeg Optimization...", flush=True)
          ret = subprocess.run(ffmpeg_cmd)

          final_upload_file = optimized_video if (ret.returncode == 0 and os.path.exists(optimized_video)) else input_video
          final_size_mb = os.path.getsize(final_upload_file) / (1024 * 1024)
          print(f"\n✅ Ready for Upload! Final File Size: {final_size_mb:.2f} MB", flush=True)

          # 🎯 4. Upload directly to Telegram Channel via Telethon
          async def upload_to_telegram():
              print("\n🚀 Connecting to Telegram MTProto API...", flush=True)
              client = TelegramClient(
                  'gh_cloud_session',
                  API_ID,
                  API_HASH,
                  timeout=180,
                  retry_delay=5,
                  connection_retries=10,
                  auto_reconnect=True
              )
              await client.start(bot_token=BOT_TOKEN)

              # Poster Upload
              if POSTER and (POSTER.startswith("http://") or POSTER.startswith("https://")):
                  try:
                      await client.send_file(
                          THUMBNAILS_CHANNEL,
                          POSTER,
                          caption=f"🎬 <b>{TITLE}</b>\n🇱🇰 සිංහල උපසිරැසි සහිතයි | CineStream Movie Hub",
                          parse_mode='html'
                      )
                      print("✅ Poster uploaded!", flush=True)
                  except Exception as pe:
                      print(f"⚠️ Poster note: {pe}")

              # Video Upload
              print(f"\n🚀 Uploading {final_size_mb:.2f} MB Movie to Telegram ({MOVIES_CHANNEL})...", flush=True)

              def progress(current, total):
                  pct = (current / total) * 100
                  cur_mb = current / (1024 * 1024)
                  tot_mb = total / (1024 * 1024)
                  print(f"\r⚡ Telegram Upload: {pct:.1f}% ({cur_mb:.1f}MB / {tot_mb:.1f}MB)", end="", flush=True)

              msg = await client.send_file(
                  MOVIES_CHANNEL,
                  final_upload_file,
                  caption=f"🎥 <b>{TITLE}</b> Full Movie\n🇱🇰 CineStream Official Release",
                  parse_mode='html',
                  supports_streaming=True,
                  progress_callback=progress
              )

              # Subtitle file upload
              if subtitle_file and os.path.exists(subtitle_file):
                  try:
                      await client.send_file(
                          MOVIES_CHANNEL,
                          subtitle_file,
                          caption=f"📝 <b>{TITLE}</b> Sinhala Subtitle (.srt)\n🇱🇰 සිංහල උපසිරැසි ගොනුව",
                          parse_mode='html'
                      )
                  except Exception as se:
                      print(f"Subtitle upload note: {se}")

              chan_clean = str(MOVIES_CHANNEL).replace("-100", "")
              print("\n\n=======================================================")
              print(f"🎉 සාර්ථකයි! චිත්‍රපටය Telegram Channel එකට සම්පූර්ණයෙන්ම Upload විය!")
              print(f"🔗 Direct Stream Post: https://t.me/c/{chan_clean}/{msg.id}")
              print(f"🆔 Telegram Message ID: {msg.id}")
              print("=======================================================\n", flush=True)

              await client.disconnect()

          asyncio.run(upload_to_telegram())
          EOF
          python uploader.py
