name: CineStream 10Gbps Cloud Torrent Uploader

on:
  workflow_dispatch:
    inputs:
      movie_title:
        description: 'Film Title (චිත්‍රපටයේ නම)'
        required: true
        default: 'Mutiny (2026)'
      magnet_link:
        description: 'Magnet Link or Torrent URL'
        required: true
      poster_url:
        description: 'Poster Image URL (Optional)'
        required: false
        default: ''

jobs:
  cloud_download_and_upload:
    name: Cloud Torrent Engine (0MB Your Data)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🛠️ Install System Tools (aria2c, ffmpeg)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y aria2 ffmpeg
          pip install requests urllib3

      - name: 🚀 Start Local Telegram Bot API Server (Enables 2GB Uploads)
        run: |
          mkdir -p /tmp/cinestream_cloud
          docker run -d --name tg-bot-api -p 8081:8081 \
            -v /tmp/cinestream_cloud:/var/lib/telegram-bot-api \
            aiogram/telegram-bot-api --api-id=2040 --api-hash=b18441a1ff607e10a989891a5462e627 --local
          sleep 4
          curl -s http://127.0.0.1:8081 || echo "Local server ready"

      - name: ⚡ Download Magnet at 10Gbps & Stream to Telegram
        id: uploader
        env:
          MAGNET_LINK: ${{ github.event.inputs.magnet_link }}
          MOVIE_TITLE: ${{ github.event.inputs.movie_title }}
          POSTER_URL: ${{ github.event.inputs.poster_url }}
          TELEGRAM_BOT_TOKEN: "8784845752:AAFSX0fkHyALs79xgp8RNs9LExV9LeLyBQs"
          MOVIES_CHANNEL_ID: "-1003984700777"
          DOWNLOAD_DIR: "/tmp/cinestream_cloud"
          LOCAL_BOT_API: "http://127.0.0.1:8081"
        run: |
          python3 backend/cloud_torrent_uploader.py
