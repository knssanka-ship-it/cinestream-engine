name: CineStream Cloud Torrent Uploader

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Movie Title (චිත්‍රපටයේ නම)'
        required: true
        default: 'Mutiny (2026)'
      magnet:
        description: 'Torrent Magnet Link'
        required: true
      poster:
        description: 'Poster Image URL (විකල්පයි)'
        required: false
        default: 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=800'

jobs:
  cloud_download_and_upload:
    runs-on: ubuntu-latest
    steps:
      - name: 🛠️ Setup Fast Engines
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y aria2 ffmpeg
          pip install telethon cryptg requests

      - name: 🚀 Torrent Download & Telegram 2GB Upload
        env:
          BOT_TOKEN: "8784845752:AAFSX0fkHyALs79xgp8RNs9LExV9LeLyBQs"
          MOVIES_CHANNEL: "-1003984700777"
          THUMBNAILS_CHANNEL: "-1003771325554"
          MOVIE_TITLE: "${{ github.event.inputs.title }}"
          MAGNET_LINK: "${{ github.event.inputs.magnet }}"
          POSTER_URL: "${{ github.event.inputs.poster }}"
        run: |
          cat << 'EOF' > uploader.py
          import os, glob, asyncio, subprocess
          from telethon import TelegramClient

          API_ID = 31518596
          API_HASH = "450525f29be7392a388c0547e391360f"
          BOT_TOKEN = os.environ["BOT_TOKEN"]
          MOVIES_CHANNEL = int(os.environ["MOVIES_CHANNEL"])
          THUMBNAILS_CHANNEL = int(os.environ["THUMBNAILS_CHANNEL"])
          TITLE = os.environ["MOVIE_TITLE"]
          MAGNET = os.environ["MAGNET_LINK"]
          POSTER = os.environ.get("POSTER_URL", "")

          print(f"🎬 [CLOUD 10Gbps] Downloading: '{TITLE}'...")
          os.makedirs("/tmp/movie_temp", exist_ok=True)

          # High Speed Trackers for YTS & Global Swarms
          trackers = (
              "&tr=udp://tracker.opentrackr.org:1337/announce"
              "&tr=udp://open.tracker.cl:1337/announce"
              "&tr=udp://open.demonii.com:1337/announce"
              "&tr=udp://tracker.openbittorrent.com:80"
              "&tr=udp://tracker.coppersurfer.tk:6969"
              "&tr=udp://glotorrents.pw:6969/announce"
              "&tr=udp://p4p.arenabg.com:1337"
              "&tr=udp://tracker.leechers-paradise.org:6969"
          )
          full_magnet = MAGNET + trackers if not "&tr=" in MAGNET else MAGNET

          # Download using Aria2 multi-connection
          cmd = [
              "aria2c",
              "--enable-dht=true",
              "--bt-enable-lpd=true",
              "--enable-peer-exchange=true",
              "--bt-max-peers=150",
              "--file-allocation=none",
              "--seed-time=0",
              "--summary-interval=5",
              "--dir=/tmp/movie_temp",
              full_magnet
          ]
          subprocess.run(cmd)

          # Telethon 2GB MTProto Cloud Upload
          async def upload_to_telegram():
              client = TelegramClient('gh_cloud_session', API_ID, API_HASH)
              await client.start(bot_token=BOT_TOKEN)

              # Upload Thumbnail
              if POSTER:
                  print("🖼️ Uploading Poster...")
                  try:
                      await client.send_file(
                          THUMBNAILS_CHANNEL,
                          POSTER,
                          caption=f"🎬 <b>{TITLE}</b>\n🇱🇰 සිංහල උපසිරැසි සහිතයි",
                          parse_mode='html'
                      )
                  except Exception as pe:
                      print(f"Notice on poster: {pe}")

              # Find Video file
              v_files = glob.glob("/tmp/movie_temp/**/*.mp4", recursive=True) + glob.glob("/tmp/movie_temp/**/*.mkv", recursive=True)
              if v_files:
                  m_file = max(v_files, key=os.path.getsize)
                  size_mb = os.path.getsize(m_file) / (1024 * 1024)
                  print(f"🚀 Uploading {size_mb:.2f} MB Movie directly to Telegram Channel...")

                  def progress(current, total):
                      pct = (current / total) * 100
                      print(f"\r⚡ Upload: {pct:.1f}% ({current/(1024*1024):.1f}MB / {total/(1024*1024):.1f}MB)", end="")

                  await client.send_file(
                      MOVIES_CHANNEL,
                      m_file,
                      caption=f"🎥 <b>{TITLE}</b> Full Movie\n🇱🇰 CineStream Official Release",
                      parse_mode='html',
                      supports_streaming=True,
                      progress_callback=progress
                  )
                  print("\n\n🎉 සාර්ථකයි! සම්පූර්ණ චිත්‍රපටයම Telegram Channel එකට Upload විය!")
              else:
                  print("❌ No video file found.")

              await client.disconnect()

          asyncio.run(upload_to_telegram())
          EOF
          python uploader.py
