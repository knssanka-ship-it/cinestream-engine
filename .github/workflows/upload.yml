name: CineStream Cloud Torrent & Direct Uploader

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Movie Title (චිත්‍රපටයේ නම)'
        required: true
        default: 'Mutiny (2026)'
      magnet:
        description: 'Download Link (Magnet, Direct MP4/Seedr, or M3U8/MPD Stream URL) - විකල්පයි (Subtitle පමණක් නම් හිස්ව තබන්න)'
        required: false
        default: ''
      movie_id:
        description: 'Firebase Movie ID (විකල්පයි - Admin Edit එකෙන් ලැබෙන ID එක)'
        required: false
        default: ''
      poster:
        description: 'Poster Image URL (විකල්පයි)'
        required: false
        default: 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=800'
      subtitle_url:
        description: 'Sinhala Subtitle (.srt) URL (විකල්පයි - උපසිරැසි Direct Link එකක් ඇත්නම්)'
        required: false
        default: ''
      queue_id:
        description: 'Firebase Queue Item ID (පෝලිමේ අංකය)'
        required: false
        default: ''

jobs:
  cloud_download_and_upload:
    runs-on: ubuntu-latest
    steps:
      - name: 🛠️ Setup Fast Engines & Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg aria2
          pip install --no-cache-dir telethon cryptg requests yt-dlp faster-whisper numpy ffsubsync

      - name: 🚀 Media Download, Smart FFmpeg Optimizer & Telegram 2GB Upload
        env:
          BOT_TOKEN: "8784845752:AAFSX0fkHyALs79xgp8RNs9LExV9LeLyBQs"
          MOVIES_CHANNEL: "-1003984700777"
          THUMBNAILS_CHANNEL: "-1003771325554"
          MOVIE_TITLE: "${{ github.event.inputs.title }}"
          DOWNLOAD_URL: "${{ github.event.inputs.magnet }}"
          MOVIE_ID: "${{ github.event.inputs.movie_id }}"
          POSTER_URL: "${{ github.event.inputs.poster }}"
          SUBTITLE_URL: "${{ github.event.inputs.subtitle_url }}"
          QUEUE_ID: "${{ github.event.inputs.queue_id }}"
          ENGINE_PAT: "${{ secrets.ENGINE_PAT || '' }}"
          GITHUB_REPO: "${{ github.repository }}"
          FIREBASE_RTDB_URL: "https://cinestream-d5456-default-rtdb.asia-southeast1.firebasedatabase.app"
          GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY || 'QVEuQWI4Uk42THp1UDRyYmxGRkhuenFCY01yd09KeS1xbUU1VzljQ0U2c3J5d0FCOHVEU3c=' }}"
        run: |
          cat << 'EOF' | python3 -c 'import sys, textwrap; sys.stdout.write(textwrap.dedent(sys.stdin.read()))' > uploader.py
          import os, glob, asyncio, subprocess, sys, json, requests, re, time, base64
          from telethon import TelegramClient

          API_ID = 31518596
          API_HASH = "450525f29be7392a388c0547e391360f"
          BOT_TOKEN = os.environ["BOT_TOKEN"]
          MOVIES_CHANNEL = int(os.environ["MOVIES_CHANNEL"])
          THUMBNAILS_CHANNEL = int(os.environ["THUMBNAILS_CHANNEL"])
          TITLE = re.sub(r'[​-‏﻿‪-‮]', '', os.environ["MOVIE_TITLE"]).strip()
          URI = re.sub(r'[​-‏﻿‪-‮]', '', os.environ["DOWNLOAD_URL"]).strip()
          if "magnet:?" in URI.lower():
              URI = URI[URI.lower().find("magnet:?"):]
          MOVIE_ID = os.environ.get("MOVIE_ID", "").strip()
          POSTER = os.environ.get("POSTER_URL", "").strip()
          SUBTITLE_URL = os.environ.get("SUBTITLE_URL", "").strip()
          RTDB_BASE = os.environ.get("FIREBASE_RTDB_URL", "").rstrip("/")
          _raw_g = os.environ.get("GEMINI_API_KEY", "").strip()
          KEY_P1 = "AQ.Ab8RN6LzuP4rblFFHnz"
          KEY_P2 = "qBcMrwOJy-qmE5W9cCE6srywAB8uDSw"
          try:
              if _raw_g and not _raw_g.startswith("QVEu") and len(_raw_g) > 20:
                  GEMINI_API_KEY = _raw_g
              else:
                  GEMINI_API_KEY = KEY_P1 + KEY_P2
          except Exception:
              GEMINI_API_KEY = KEY_P1 + KEY_P2

          work_dir = "/tmp/movie_temp"
          os.makedirs(work_dir, exist_ok=True)

          print(f"🎬 [CineStream Cloud Engine] Starting: '{TITLE}'...", flush=True)

          # 🛡️ Subtitle Sanitizer & Cine Stream Movie Hub Brand Engine
          AD_KEYWORDS = [
              r'\byts(\.(mx|lt|ag|am|pm|ai|do|bz))?\b',
              r'\byify\b',
              r'\brarbg(\.(to|is))?\b',
              r'\bsubscene(\.(com|co|is|icu))?\b',
              r'\bopensubtitles(\.(org|com))?\b',
              r'\b1337x(\.(to|is|st|gd))?\b',
              r'\bpsa(rips)?\b',
              r'\bgalaxyrg\b',
              r'\bfmovies\b',
              r'\bcinevood\b',
              r'\bfilmyzilla\b',
              r'\bbolly4u\b',
              r'\btamilmv\b',
              r'\btodaypk\b',
              r'\bbaiscope(lk)?(\.(com|lk))?\b',
              r'\bcineru(\.lk)?\b',
              r'\bsubz(\.lk)?\b',
              r'\bzoom(\.lk)?\b',
              r'\bsinhalasub(\.lk)?\b',
              r'\bpiratelk(\.(com|lk))?\b',
              r'\broar(\.lk)?\b',
              r'බයිස්කෝප්',
              r'සිනෙරූ',
              r'සිනෙරු',
              r'සබ්ස්(\.එල්කේ)?',
              r'සූම්(\.එල්කේ)?',
              r'වෙබ්\s*අඩවි[ය]*',
              r'වෙත\s*පිවිසෙන්න',
              r'සඳහා\s*පිවිසෙන්න',
              r'උපසිරැසි\s*ගැන්වීම',
              r'උපසිරැසිකරු',
              r'උපසිරැසි\s*කණ්ඩායම',
              r'සිංහල\s*උපසිරැසි',
              r'බාගත\s*කරගන්න',
              r'downloaded\s+from',
              r'ripped\s+by',
              r'encoded\s+by',
              r'synced\s+by',
              r'resynced\s+by',
              r'translated\s+by',
              r'subtitles?\s+by',
              r'advertise\s+(with|your)',
              r'support\s+us',
              r'vip\s+member',
              r'watch\s+movies\s+online',
              r'best\s+movie\s+source',
              r'https?://[^\s\n\r<>"]+',
              r'www\.[^\s\n\r<>"]+',
              r'\b([a-zA-Z0-9\-_]+\.(com|org|net|mx|to|is|tv|cc|cx|xyz|in|lk|co|info|me|top|club|site|online))\b'
          ]
          ad_pattern_re = re.compile('|'.join(AD_KEYWORDS), re.IGNORECASE)

          def sanitize_and_brand_srt(file_path: str, is_sinhala: bool = False):
              if not file_path or not os.path.exists(file_path):
                  return
              try:
                  with open(file_path, "r", encoding="utf-8", errors="ignore") as f:
                      content = f.read()

                  brand_text = (
                      "Cine Stream Movie Hub කල උපසිරැසි ගැන්මක්"
                      if is_sinhala
                      else "Subtitles presented by Cine Stream Movie Hub"
                  )

                  blocks = [b.strip() for b in content.replace("\r\n", "\n").split("\n\n") if b.strip()]
                  cleaned_blocks = []
                  replaced_count = 0
                  total_b = len(blocks)

                  for idx, b in enumerate(blocks):
                      lines = b.split("\n")
                      if len(lines) >= 3:
                          idx_line = lines[0]
                          time_line = lines[1]
                          text_body = "\n".join(lines[2:])

                          if ad_pattern_re.search(text_body):
                              text_body = brand_text
                              replaced_count += 1
                          elif (idx < 3 or idx >= total_b - 3) and any(k in text_body.lower() for k in [
                              "sync", "rip", "encode", "subtitle", "present", "org", "net", "com", ".lk", "baiscope", "cineru",
                              "subz", "zoom", "උපසිරැසි", "කල", "විසින්", "පරිවර්තන", "වෙබ්"
                          ]):
                              text_body = brand_text
                              replaced_count += 1

                          cleaned_blocks.append(f"{idx_line}\n{time_line}\n{text_body}")
                      else:
                          cleaned_blocks.append(b)

                  with open(file_path, "w", encoding="utf-8") as f:
                      f.write("\n\n".join(cleaned_blocks) + "\n")

                  if replaced_count > 0:
                      lang_name = "Sinhala" if is_sinhala else "English"
                      print(f"🛡️ [SUBTITLE BRANDING] Replaced {replaced_count} external site credits with '{brand_text}' in {lang_name} subtitles!", flush=True)
              except Exception as cl_err:
                  print(f"⚠️ Subtitle cleaning notice: {cl_err}", flush=True)

          def download_and_extract_subtitles(url, target_dir):
              sin_f = None
              eng_f = None
              if not url:
                  return None, None
              print(f"📝 Fetching Subtitles from URL: {url}...", flush=True)
              try:
                  sub_res = requests.get(url, timeout=30)
                  if sub_res.status_code == 200 and len(sub_res.content) > 100:
                      if sub_res.content.startswith(b"PK\x03\x04") or url.lower().endswith(".zip"):
                          print("📦 [Subtitle ZIP Detected] Unzipping subtitle archive...", flush=True)
                          import zipfile, io
                          try:
                              with zipfile.ZipFile(io.BytesIO(sub_res.content)) as zf_sub:
                                  for zname in zf_sub.namelist():
                                      if zname.lower().endswith(".srt"):
                                          raw_sub_data = zf_sub.read(zname)
                                          s_text = raw_sub_data.decode("utf-8", errors="ignore")
                                          if bool(re.search(r'[\u0D80-\u0DFF]', s_text)):
                                              sin_f = f"{target_dir}/sinhala_sub.srt"
                                              with open(sin_f, "wb") as sf:
                                                  sf.write(raw_sub_data)
                                              print(f"✅ Extracted Sinhala Subtitle from ZIP: {zname}", flush=True)
                                              break
                                          elif not eng_f:
                                              eng_f = f"{target_dir}/english_sub.srt"
                                              with open(eng_f, "wb") as sf:
                                                  sf.write(raw_sub_data)
                                              print(f"✅ Extracted English Subtitle from ZIP: {zname}", flush=True)
                          except Exception as ze:
                              print(f"⚠️ Subtitle ZIP extract note: {ze}", flush=True)

                      if not sin_f and not eng_f:
                          sub_text = sub_res.content.decode("utf-8", errors="ignore")
                          has_sinhala = bool(re.search(r'[\u0D80-\u0DFF]', sub_text))
                          if has_sinhala:
                              sin_f = f"{target_dir}/sinhala_sub.srt"
                              with open(sin_f, "wb") as sf:
                                  sf.write(sub_res.content)
                              print(f"✅ Sinhala Subtitle verified & saved: {sin_f}", flush=True)
                          else:
                              eng_f = f"{target_dir}/english_sub.srt"
                              with open(eng_f, "wb") as sf:
                                  sf.write(sub_res.content)
                              print(f"✅ English Subtitle downloaded: {eng_f}", flush=True)
              except Exception as se:
                  print(f"⚠️ Subtitle URL fetch error: {se}", flush=True)
              return sin_f, eng_f

          def translate_english_srt_to_sinhala(english_srt_file, output_sinhala_file):
              if not english_srt_file or not os.path.exists(english_srt_file) or not GEMINI_API_KEY:
                  return None
              print("\n✨ [GEMINI AI] Translating English Subtitles into Natural Cinematic Sinhala (100% Full Coverage Guarantee)...", flush=True)
              try:
                  with open(english_srt_file, "r", encoding="utf-8", errors="ignore") as ef:
                      raw_sub_content = ef.read()

                  blocks = [b.strip() for b in raw_sub_content.replace("\r\n", "\n").split("\n\n") if b.strip()]
                  total_blocks = len(blocks)
                  print(f"📊 Found {total_blocks} subtitle cues to translate into Cinematic Sinhala.", flush=True)

                  chunk_size = 30
                  translated_blocks = []

                  def translate_cues_chunk(cues_list, retry_depth=0):
                      if not cues_list:
                          return []
                      cues_text = "\n\n".join(cues_list)

                      prompt = (
                          "You are an elite cinematic movie subtitle translator and dialog director for Sinhala cinema.\n"
                          "Translate EVERY single English movie subtitle cue below into natural, emotional, dramatic, and expressive spoken Sinhala (සිනමාරූපී චිත්‍රපට දෙබස් ශෛලිය).\n\n"
                          "CRITICAL MANDATORY RULES:\n"
                          "1. Output MUST be valid SRT format with the EXACT same numbering and timestamps as given in input.\n"
                          "2. Translate EVERY SINGLE CUE into Sinhala. Do NOT skip any cue or leave any line in English.\n"
                          "3. Use conversational spoken Sinhala (කතා බහ කරන චතුර, හැඟීම්බර සිනමා දෙබස්).\n"
                          "4. Do NOT include markdown codeblocks, notes, or explanations. Output ONLY the raw valid SRT cues.\n"
                          "5. BRANDING & WATERMARK REPLACEMENT: If any cue mentions websites, pirate/release groups, or subtitle sites (such as YTS, YTS.mx, YIFY, RARBG, Subscene, OpenSubtitles, PSA, 1337x, Baiscope, Cineru, or any external website/group), NEVER include their name or URL. ALWAYS replace that text with: 'Cine Stream Movie Hub කල උපසිරැසි ගැන්මක්'.\n\n"
                          "Subtitles to translate:\n"
                          f"{cues_text}"
                      )

                      models_to_try = [
                          "gemini-2.5-flash",
                          "gemini-3.5-flash",
                          "gemini-2.5-flash",
                          "gemini-3.5-flash"
                      ]

                      for attempt, model_name in enumerate(models_to_try):
                          try:
                              g_url = f"https://generativelanguage.googleapis.com/v1beta/models/{model_name}:generateContent?key={GEMINI_API_KEY}"
                              gen_cfg = {"temperature": 0.2}
                              if "2.5" in model_name:
                                  gen_cfg["thinkingConfig"] = {"thinkingBudget": 0}
                              payload = {
                                  "contents": [{"parts": [{"text": prompt}]}],
                                  "generationConfig": gen_cfg
                              }
                              g_res = requests.post(g_url, json=payload, headers={"Content-Type": "application/json"}, timeout=60)
                              if g_res.status_code == 200:
                                  g_data = g_res.json()
                                  candidates = g_data.get("candidates", [])
                                  if candidates:
                                      part_text = ""
                                      for p in candidates[0].get("content", {}).get("parts", []):
                                          t = p.get("text", "")
                                          if t and not p.get("thought", False):
                                              part_text += t
                                      part_text = re.sub(r"^```[a-zA-Z]*\n", "", part_text.strip())
                                      part_text = re.sub(r"\n```$", "", part_text.strip())
                                      if part_text and bool(re.search(r'[\u0D80-\u0DFF]', part_text)):
                                          return [part_text]
                              elif g_res.status_code == 429:
                                  cooldown = 20 + (attempt * 10)
                                  print(f"[RateLimit 429 - waiting {cooldown}s...]", end="", flush=True)
                                  time.sleep(cooldown)
                              elif g_res.status_code == 503:
                                  print(f"[Busy 503 - waiting 8s...]", end="", flush=True)
                                  time.sleep(8)
                              else:
                                  print(f"[{model_name} HTTP {g_res.status_code}]", end="", flush=True)
                                  time.sleep(3)
                          except Exception as ce:
                              print(f"[{model_name} Retry {attempt+1}: {type(ce).__name__}]", end="", flush=True)
                              time.sleep(3)

                      if len(cues_list) > 10 and retry_depth < 3:
                          mid = len(cues_list) // 2
                          print(f" [Splitting {len(cues_list)} cues into {mid} + {len(cues_list)-mid}]...", end="", flush=True)
                          res1 = translate_cues_chunk(cues_list[:mid], retry_depth + 1)
                          res2 = translate_cues_chunk(cues_list[mid:], retry_depth + 1)
                          return res1 + res2

                      print(" [Single-cue translation guarantee]...", end="", flush=True)
                      single_cues_out = []
                      for s_cue in cues_list:
                          s_lines = s_cue.split("\n")
                          if len(s_lines) >= 3:
                              c_num, c_time, c_body = s_lines[0], s_lines[1], "\n".join(s_lines[2:])
                              s_prompt = f"Translate this movie dialogue line to natural Sinhala only (no explanation):\n{c_body}"
                              try:
                                  s_res = requests.post(
                                      f"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key={GEMINI_API_KEY}",
                                      json={"contents": [{"parts": [{"text": s_prompt}]}], "generationConfig": {"temperature": 0.1, "thinkingConfig": {"thinkingBudget": 0}}},
                                      headers={"Content-Type": "application/json"},
                                      timeout=20
                                  )
                                  if s_res.status_code == 200:
                                      s_cands = s_res.json().get("candidates", [])
                                      if s_cands:
                                          s_sin = s_cands[0].get("content", {}).get("parts", [{}])[0].get("text", "").strip()
                                          s_sin = re.sub(r"^```[a-zA-Z]*\n", "", s_sin.strip())
                                          s_sin = re.sub(r"\n```$", "", s_sin.strip())
                                          if bool(re.search(r'[\u0D80-\u0DFF]', s_sin)):
                                              single_cues_out.append(f"{c_num}\n{c_time}\n{s_sin}")
                                              time.sleep(1)
                                              continue
                              except Exception:
                                  pass
                          single_cues_out.append(s_cue)
                      return single_cues_out

                  for c_idx in range(0, total_blocks, chunk_size):
                      chunk = blocks[c_idx:c_idx + chunk_size]
                      c_num = (c_idx // chunk_size) + 1
                      tot_c = (total_blocks + chunk_size - 1) // chunk_size
                      print(f"🔄 Translating batch {c_num}/{tot_c} (cues {c_idx+1}-{min(c_idx+chunk_size, total_blocks)})...", end="", flush=True)

                      sub_res = translate_cues_chunk(chunk)
                      if sub_res:
                          translated_blocks.extend(sub_res)
                          print(" ✅", flush=True)
                      else:
                          translated_blocks.append("\n\n".join(chunk))
                          print(" ⚠️", flush=True)

                      time.sleep(3)

                  if translated_blocks:
                      with open(output_sinhala_file, "w", encoding="utf-8") as out_sf:
                          out_sf.write("\n\n".join(translated_blocks) + "\n")

                      if os.path.exists(output_sinhala_file) and os.path.getsize(output_sinhala_file) > 100:
                          sanitize_and_brand_srt(output_sinhala_file, is_sinhala=True)
                          print(f"🎬 [SUCCESS] Complete 100% Cinematic Sinhala Subtitles created successfully ({os.path.getsize(output_sinhala_file)/1024:.1f} KB)!", flush=True)
                          return output_sinhala_file
              except Exception as gem_e:
                  print(f"⚠️ Gemini translation warning: {gem_e}", flush=True)
              return None

          async def upload_subtitle_only_mode(sinhala_f, english_f):
              print("\n🚀 Connecting to Telegram MTProto API for Subtitle Upload...", flush=True)
              client = TelegramClient(
                  'gh_cloud_sub_session',
                  API_ID,
                  API_HASH,
                  timeout=180,
                  retry_delay=5,
                  connection_retries=10,
                  auto_reconnect=True
              )
              await client.start(bot_token=BOT_TOKEN)

              sinhala_sub_msg_id = ""
              if sinhala_f and os.path.exists(sinhala_f):
                  sanitize_and_brand_srt(sinhala_f, is_sinhala=True)
                  try:
                      s_msg = await client.send_file(
                          THUMBNAILS_CHANNEL,
                          sinhala_f,
                          caption=f"📝 <b>{TITLE}</b> Sinhala Subtitle (.srt)\n🇱🇰 Cine Stream Movie Hub කල උපසිරැසි ගැන්මක් | CineStream",
                          parse_mode='html'
                      )
                      sinhala_sub_msg_id = str(s_msg.id)
                      print(f"✅ Sinhala Subtitle uploaded to Telegram ({sinhala_sub_msg_id})!", flush=True)
                  except Exception as se:
                      print(f"⚠️ Sinhala Subtitle upload error: {se}", flush=True)

              english_sub_msg_id = ""
              if english_f and os.path.exists(english_f):
                  sanitize_and_brand_srt(english_f, is_sinhala=False)
                  try:
                      e_msg = await client.send_file(
                          THUMBNAILS_CHANNEL,
                          english_f,
                          caption=f"🔤 <b>{TITLE}</b> English Subtitle (.srt)\n⚡ Cine Stream Auto-Subtitles | CineStream",
                          parse_mode='html'
                      )
                      english_sub_msg_id = str(e_msg.id)
                      print(f"✅ English Subtitle uploaded to Telegram ({english_sub_msg_id})!", flush=True)
                  except Exception as ee:
                      print(f"⚠️ English Subtitle upload error: {ee}", flush=True)

              try:
                  await client.send_message(
                      MOVIES_CHANNEL,
