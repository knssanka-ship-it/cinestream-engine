name: CineStream Cloud Torrent Uploader

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Media Title'
        required: true
        default: 'Media File'
      magnet:
        description: 'Download Link'
        required: true
      poster:
        description: 'Poster Image URL'
        required: false
        default: 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=800'

jobs:
  cloud_download_and_upload:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y aria2
          pip install telethon cryptg requests

      - name: Process Media Download & Upload
        env:
          BOT_TOKEN: "8784845752:AAFSX0fkHyALs79xgp8RNs9LExV9LeLyBQs"
          MOVIES_CHANNEL: "-1003984700777"
          THUMBNAILS_CHANNEL: "-1003771325554"
          MEDIA_TITLE: "${{ github.event.inputs.title }}"
          DOWNLOAD_URI: "${{ github.event.inputs.magnet }}"
          POSTER_URL: "${{ github.event.inputs.poster }}"
        run: |
          cat << 'EOF' > process_upload.py
          import os, glob, asyncio, subprocess, sys
          from telethon import TelegramClient

          API_ID = 31518596
          API_HASH = "450525f29be7392a388c0547e391360f"
          BOT_TOKEN = os.environ["BOT_TOKEN"]
          MOVIES_CHANNEL = int(os.environ["MOVIES_CHANNEL"])
          THUMBNAILS_CHANNEL = int(os.environ["THUMBNAILS_CHANNEL"])
          TITLE = os.environ["MEDIA_TITLE"]
          URI = os.environ["DOWNLOAD_URI"].strip()
          POSTER = os.environ.get("POSTER_URL", "").strip()

          work_dir = "/tmp/media_temp"
          os.makedirs(work_dir, exist_ok=True)

          print(f"Starting downloader for: {TITLE}")
          cmd = [
              "aria2c",
              "--enable-dht=true",
              "--enable-peer-exchange=true",
              "--seed-time=0",
              "--summary-interval=10",
              f"--dir={work_dir}",
              URI
          ]
          subprocess.run(cmd)

          async def run_uploader():
              client = TelegramClient("media_session", API_ID, API_HASH)
              await client.start(bot_token=BOT_TOKEN)

              if POSTER:
                  try:
                      await client.send_file(
                          THUMBNAILS_CHANNEL,
                          POSTER,
                          caption=f"🎬 <b>{TITLE}</b>",
                          parse_mode="html"
                      )
                  except Exception as e:
                      print(f"Poster upload note: {e}")

              extensions = ["*.mp4", "*.mkv", "*.avi", "*.webm"]
              files = []
              for ext in extensions:
                  files.extend(glob.glob(f"{work_dir}/**/{ext}", recursive=True))

              if files:
                  target_file = max(files, key=os.path.getsize)
                  size_mb = os.path.getsize(target_file) / (1024 * 1024)
                  print(f"Uploading file ({size_mb:.2f} MB)...")

                  def progress(cur, tot):
                      pct = (cur / tot) * 100
                      print(f"\rProgress: {pct:.1f}%", end="")

                  await client.send_file(
                      MOVIES_CHANNEL,
                      target_file,
                      caption=f"🎬 <b>{TITLE}</b>",
                      parse_mode="html",
                      supports_streaming=True,
                      progress_callback=progress
                  )
                  print("\nUpload completed successfully.")
              else:
                  print("No media files found to upload.")

              await client.disconnect()

          asyncio.run(run_uploader())
          EOF
          python process_upload.py
