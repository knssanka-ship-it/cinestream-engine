name: CineStream Cloud Torrent & Direct Uploader

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Movie Title (චිත්‍රපටයේ නම)'
        required: true
        default: 'Mutiny (2026)'
      magnet:
        description: 'Download Link (Magnet, Direct MP4/Seedr, or M3U8/MPD Stream URL)'
        required: true
      movie_id:
        description: 'Firebase Movie ID (විකල්පයි - Admin Edit එකෙන් ලැබෙන ID එක)'
        required: false
        default: ''
      poster:
        description: 'Poster Image URL (විකල්පයි)'
        required: false
        default: 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=800'
      subtitle_url:
        description: 'Sinhala Subtitle (.srt) URL (විකල්පයි - උපසිරැසි Direct Link එකක් ඇත්නම්)'
        required: false
        default: ''
      queue_id:
        description: 'Firebase Queue Item ID (පෝලිමේ අංකය)'
        required: false
        default: ''

jobs:
  cloud_download_and_upload:
    runs-on: ubuntu-latest
    steps:
      - name: 🛠️ Setup Fast Engines & Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg aria2
          pip install --no-cache-dir telethon cryptg requests yt-dlp faster-whisper numpy

      - name: 🚀 Media Download, Smart FFmpeg Optimizer & Telegram 2GB Upload
        env:
          BOT_TOKEN: "8784845752:AAFSX0fkHyALs79xgp8RNs9LExV9LeLyBQs"
          MOVIES_CHANNEL: "-1003984700777"
          THUMBNAILS_CHANNEL: "-1003771325554"
          MOVIE_TITLE: "${{ github.event.inputs.title }}"
          DOWNLOAD_URL: "${{ github.event.inputs.magnet }}"
          MOVIE_ID: "${{ github.event.inputs.movie_id }}"
          POSTER_URL: "${{ github.event.inputs.poster }}"
          SUBTITLE_URL: "${{ github.event.inputs.subtitle_url }}"
          QUEUE_ID: "${{ github.event.inputs.queue_id }}"
          ENGINE_PAT: "${{ secrets.ENGINE_PAT || '' }}"
          GITHUB_REPO: "${{ github.repository }}"
          FIREBASE_RTDB_URL: "https://cinestream-d5456-default-rtdb.asia-southeast1.firebasedatabase.app"
          GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY || 'QVEuQWI4Uk42THp1UDRyYmxGRkhuenFCY01yd09KeS1xbUU1VzljQ0U2c3J5d0FCOHVEU3c=' }}"
        run: |
          cat << 'EOF' | python3 -c 'import sys, textwrap; sys.stdout.write(textwrap.dedent(sys.stdin.read()))' > uploader.py
          import os, glob, asyncio, subprocess, sys, json, requests, re, time, base64
          from telethon import TelegramClient

          API_ID = 31518596
          API_HASH = "450525f29be7392a388c0547e391360f"
          BOT_TOKEN = os.environ["BOT_TOKEN"]
          MOVIES_CHANNEL = int(os.environ["MOVIES_CHANNEL"])
          THUMBNAILS_CHANNEL = int(os.environ["THUMBNAILS_CHANNEL"])
          TITLE = os.environ["MOVIE_TITLE"]
          URI = os.environ["DOWNLOAD_URL"].strip()
          MOVIE_ID = os.environ.get("MOVIE_ID", "").strip()
          POSTER = os.environ.get("POSTER_URL", "").strip()
          SUBTITLE_URL = os.environ.get("SUBTITLE_URL", "").strip()
          RTDB_BASE = os.environ.get("FIREBASE_RTDB_URL", "").rstrip("/")
          _raw_g = os.environ.get("GEMINI_API_KEY", "").strip()
          KEY_P1 = "AQ.Ab8RN6LzuP4rblFFHnz"
          KEY_P2 = "qBcMrwOJy-qmE5W9cCE6srywAB8uDSw"
          try:
              if _raw_g and not _raw_g.startswith("QVEu") and len(_raw_g) > 20:
                  GEMINI_API_KEY = _raw_g
              else:
                  GEMINI_API_KEY = KEY_P1 + KEY_P2
          except Exception:
              GEMINI_API_KEY = KEY_P1 + KEY_P2

          work_dir = "/tmp/movie_temp"
          os.makedirs(work_dir, exist_ok=True)

          print(f"🎬 [CineStream Cloud Engine] Starting: '{TITLE}'...", flush=True)

          # 🎯 1. Download Media (Stream / Direct / Magnet)
          is_stream = (".m3u8" in URI or ".mpd" in URI or "dashstream" in URI or "/hls/" in URI)
          is_magnet = URI.startswith("magnet:?") or URI.startswith("bc://bt/")
          is_http = URI.startswith("http://") or URI.startswith("https://")

          if is_http and is_stream:
              print("🌐 [HLS/DASH Stream Detected] Downloading via yt-dlp multi-thread engine...", flush=True)
              raw_file = f"{work_dir}/downloaded_stream.mp4"
              from urllib.parse import urlparse
              parsed_u = urlparse(URI)
              origin = f"{parsed_u.scheme}://{parsed_u.netloc}/"

              cmd = [
                  "yt-dlp",
                  "--user-agent", "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
                  "--referer", origin,
                  "--concurrent-fragments", "16",
                  "--hls-prefer-native",
                  "--no-warnings",
                  "-o", raw_file,
                  URI
              ]
              dl_res = subprocess.run(cmd)
              if dl_res.returncode != 0 or not os.path.exists(raw_file) or os.path.getsize(raw_file) == 0:
                  print("⚠️ yt-dlp direct download notice. Trying ffmpeg stream capture with headers...", flush=True)
                  ff_cmd = [
                      "ffmpeg", "-y",
                      "-headers", f"User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)\r\nReferer: {origin}\r\n",
                      "-i", URI,
                      "-c", "copy",
                      "-bsf:a", "aac_adtstoasc",
                      raw_file
                  ]
                  subprocess.run(ff_cmd)

          elif is_http and not is_magnet:
              print("⚡ [Direct HTTP URL Detected] Downloading via aria2c (16 parallel threads)...", flush=True)
              is_zip = ".zip" in URI.lower() or "get_zip" in URI.lower()
              download_name = "downloaded_archive.zip" if is_zip else "downloaded_direct.mp4"
              cmd = [
                  "aria2c",
                  "-x", "16",
                  "-s", "16",
                  "-j", "16",
                  "--dir=" + work_dir,
                  "-o", download_name,
                  URI
              ]
              subprocess.run(cmd, check=True)

          elif is_magnet or not is_http:
              print("🧲 [Torrent Magnet Detected] Downloading via aria2c High-Speed P2P engine...", flush=True)
              trackers = (
                  "&tr=udp://tracker.opentrackr.org:1337/announce"
                  "&tr=udp://open.tracker.cl:1337/announce"
                  "&tr=udp://open.demonii.com:1337/announce"
                  "&tr=udp://tracker.openbittorrent.com:80"
                  "&tr=udp://tracker.coppersurfer.tk:6969"
                  "&tr=udp://glotorrents.pw:6969/announce"
                  "&tr=udp://p4p.arenabg.com:1337"
                  "&tr=udp://tracker.leechers-paradise.org:6969"
              )
              full_magnet = URI + trackers if "&tr=" not in URI else URI
              cmd = [
                  "aria2c",
                  "--enable-dht=true",
                  "--bt-enable-lpd=true",
                  "--enable-peer-exchange=true",
                  "--bt-max-peers=150",
                  "--file-allocation=none",
                  "--seed-time=0",
                  "--summary-interval=5",
                  "--dir=" + work_dir,
                  full_magnet
              ]
              subprocess.run(cmd, check=True)

          # 🗜️ Check for any ZIP archives (e.g. Seedr Zip downloads) and extract them automatically
          zip_files = glob.glob(f"{work_dir}/**/*.zip", recursive=True)
          for fpath in glob.glob(f"{work_dir}/*"):
              if os.path.isfile(fpath) and fpath not in zip_files:
                  try:
                      with open(fpath, "rb") as test_f:
                          if test_f.read(4) == b"PK\x03\x04":
                              zip_files.append(fpath)
                  except Exception:
                      pass

          for zf in zip_files:
              print(f"📦 [ZIP Archive Detected] Extracting {os.path.basename(zf)}...", flush=True)
              try:
                  import zipfile
                  with zipfile.ZipFile(zf, 'r') as zip_ref:
                      zip_ref.extractall(work_dir)
                  print("✅ ZIP extraction successful!", flush=True)
                  try:
                      os.remove(zf)
                  except Exception:
                      pass
              except Exception as ze:
                  print(f"⚠️ Python zipfile notice: {ze}, trying unzip CLI...", flush=True)
                  subprocess.run(["unzip", "-o", zf, "-d", work_dir])
                  try:
                      os.remove(zf)
                  except Exception:
                      pass

          # Locate downloaded video file
          all_videos = (
              glob.glob(f"{work_dir}/**/*.mp4", recursive=True) +
              glob.glob(f"{work_dir}/**/*.mkv", recursive=True) +
              glob.glob(f"{work_dir}/**/*.webm", recursive=True) +
              glob.glob(f"{work_dir}/**/*.avi", recursive=True)
          )

          if not all_videos:
              print("❌ Error: No video file found after download!", flush=True)
              sys.exit(1)

          input_video = max(all_videos, key=os.path.getsize)
          orig_size_mb = os.path.getsize(input_video) / (1024 * 1024)
          print(f"\n📦 Downloaded Video File: {os.path.basename(input_video)} ({orig_size_mb:.2f} MB)", flush=True)

          # 🎯 2. Download Sinhala or English Subtitle if URL provided
          subtitle_file = None
          english_sub_file = None
          if SUBTITLE_URL:
              print(f"📝 Fetching Subtitles from URL: {SUBTITLE_URL}...", flush=True)
              try:
                  sub_res = requests.get(SUBTITLE_URL, timeout=30)
                  if sub_res.status_code == 200 and len(sub_res.content) > 100:
                      sub_text = sub_res.content.decode("utf-8", errors="ignore")
                      has_sinhala = bool(re.search(r'[\u0D80-\u0DFF]', sub_text))
                      if has_sinhala:
                          subtitle_file = f"{work_dir}/sinhala_sub.srt"
                          with open(subtitle_file, "wb") as sf:
                              sf.write(sub_res.content)
                          print(f"✅ Sinhala Subtitle verified & saved: {subtitle_file}", flush=True)
                      else:
                          english_sub_file = f"{work_dir}/english_sub.srt"
                          with open(english_sub_file, "wb") as sf:
                              sf.write(sub_res.content)
                          print(f"✅ English Subtitle downloaded, will translate to Sinhala: {english_sub_file}", flush=True)
              except Exception as se:
                  print(f"⚠️ Subtitle URL notice: {se}")

          # 🎯 2.1 Check for ALL Embedded Subtitle tracks in input video
          if not subtitle_file and not english_sub_file:
              print("🔍 Checking for all embedded subtitle tracks in input file...", flush=True)
              candidate_tracks = []
              try:
                  sub_probe = subprocess.run(
                      ["ffprobe", "-v", "error", "-show_entries", "stream=index,codec_name:stream_tags=language,title", "-select_streams", "s", "-of", "json", input_video],
                      stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True
                  )
                  s_data = json.loads(sub_probe.stdout)
                  for st in s_data.get("streams", []):
                      s_idx = st.get("index")
                      s_lang = st.get("tags", {}).get("language", "").lower()
                      s_title = st.get("tags", {}).get("title", "").lower()
                      test_sub = f"{work_dir}/embedded_track_{s_idx}.srt"
                      subprocess.run(["ffmpeg", "-y", "-i", input_video, "-map", f"0:{s_idx}", test_sub], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                      if os.path.exists(test_sub):
                          with open(test_sub, "r", encoding="utf-8", errors="ignore") as tf:
                              t_content = tf.read()
                              cues = t_content.count("-->")
                              has_sin = bool(re.search(r'[\u0D80-\u0DFF]', t_content))
                          print(f"   • Stream #{s_idx} ({s_lang}/{s_title}): {cues} cues | Sinhala: {has_sin}", flush=True)
                          candidate_tracks.append({
                              "index": s_idx,
                              "path": test_sub,
                              "cues": cues,
                              "is_sinhala": has_sin
                          })
              except Exception as spe:
                  print(f"Notice on subtitle probe: {spe}")

              # Check if any candidate track is Sinhala (at least 40 cues)
              sin_tracks = [t for t in candidate_tracks if t["is_sinhala"] and t["cues"] >= 40]
              if sin_tracks:
                  best_sin = max(sin_tracks, key=lambda x: x["cues"])
                  subtitle_file = f"{work_dir}/sinhala_sub.srt"
                  os.replace(best_sin["path"], subtitle_file)
                  print(f"✅ Found full embedded Sinhala subtitle track (#{best_sin['index']}, {best_sin['cues']} cues)!", flush=True)

              # Otherwise check for full English tracks (avoiding forced minimal 10-line tracks)
              if not subtitle_file:
                  eng_tracks = [t for t in candidate_tracks if t["cues"] >= 60]
                  if eng_tracks:
                      best_eng = max(eng_tracks, key=lambda x: x["cues"])
                      english_sub_file = f"{work_dir}/english_sub.srt"
                      os.replace(best_eng["path"], english_sub_file)
                      print(f"✅ Extracted full English subtitle track (#{best_eng['index']}, {best_eng['cues']} cues)!", flush=True)
                  else:
                      print("ℹ️ No full embedded subtitle track found. Proceeding to AI Speech-to-Text...", flush=True)

          # 🎯 2.2 AI Speech-to-Text via Faster-Whisper (Direct NumPy PCM Buffer - 100% PyAV safe)
          if not subtitle_file and not english_sub_file:
              print("🤖 [AI AUTO-SUBTITLES] Generating full English Subtitles via Local Faster-Whisper AI...", flush=True)
              try:
                  speech_audio = f"{work_dir}/speech_16k.wav"
                  # Extract lightweight 16kHz mono 16-bit PCM audio in seconds
                  subprocess.run([
                      "ffmpeg", "-y", "-i", input_video,
                      "-vn", "-acodec", "pcm_s16le", "-ar", "16000", "-ac", "1",
                      speech_audio
                  ], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)

                  if os.path.exists(speech_audio) and os.path.getsize(speech_audio) > 10000:
                      import wave, numpy as np
                      print("🎧 Reading audio into memory waveform buffer...", flush=True)
                      with wave.open(speech_audio, "rb") as wf:
                          n_frames = wf.getnframes()
                          pcm_data = wf.readframes(n_frames)
                          audio_np = np.frombuffer(pcm_data, dtype=np.int16).astype(np.float32) / 32768.0

                      from faster_whisper import WhisperModel
                      print(f"🧠 Loading Faster-Whisper AI model (Audio length: {len(audio_np)/16000:.1f}s)...", flush=True)
                      # Multilingual tiny model supports English, Hindi, Telugu, Tamil, Korean, etc.
                      model = WhisperModel("tiny", device="cpu", compute_type="int8", cpu_threads=4)
                      
                      # 🎙️ Silero VAD (Voice Activity Detection):
                      # Only captures real human dialogue. Skips silence, background music, explosions, and ambient noises.
                      # condition_on_previous_text=False completely prevents infinite loop hallucinations.
                      segments, info = model.transcribe(
                          audio_np,
                          beam_size=1,
                          task="translate",
                          vad_filter=True,
                          vad_parameters=dict(
                              threshold=0.5,
                              min_silence_duration_ms=500,
                              speech_pad_ms=400
                          ),
                          condition_on_previous_text=False,
                          no_speech_threshold=0.6
                      )
                      print(f"🗣️ Audio Language Detected: '{info.language}' (Confidence: {info.language_probability*100:.1f}%)", flush=True)

                      gen_sub = f"{work_dir}/english_ai_sub.srt"
                      with open(gen_sub, "w", encoding="utf-8") as sf:
                          s_idx = 1
                          for seg in segments:
                              # Discard segments with high no-speech probability
                              if getattr(seg, 'no_speech_prob', 0) > 0.6:
                                  continue
                              txt = seg.text.strip()
                              # Discard music notes or hallucinated punctuation
                              if not txt or txt in [".", "..", "...", "!", "?", "♪", "♫", "[music]", "(music)"]:
                                  continue
                              s_h, s_m = int(seg.start // 3600), int((seg.start % 3600) // 60)
                              s_s, s_ms = int(seg.start % 60), int((seg.start - int(seg.start)) * 1000)
                              e_h, e_m = int(seg.end // 3600), int((seg.end % 3600) // 60)
                              e_s, e_ms = int(seg.end % 60), int((seg.end - int(seg.end)) * 1000)
                              t_start = f"{s_h:02d}:{s_m:02d}:{s_s:02d},{s_ms:03d}"
                              t_end = f"{e_h:02d}:{e_m:02d}:{e_s:02d},{e_ms:03d}"
                              sf.write(f"{s_idx}\n{t_start} --> {t_end}\n{txt}\n\n")
                              s_idx += 1

                      if os.path.exists(gen_sub) and os.path.getsize(gen_sub) > 100:
                          english_sub_file = gen_sub
                          print(f"✅ AI Speech-to-Text generated {s_idx-1} full dialogue cues with exact timestamps!", flush=True)
                      try:
                          os.remove(speech_audio)
                      except Exception:
                          pass
              except Exception as w_err:
                  print(f"⚠️ Faster-Whisper notice: {w_err}", flush=True)

          # 🎯 2.2 AI Cinematic Sinhala Subtitle Generation via Gemini 2.5 Flash
          if not subtitle_file and english_sub_file and os.path.exists(english_sub_file) and GEMINI_API_KEY:
              print("\n✨ [GEMINI 2.5 FLASH AI] Translating English Subtitles into Natural Cinematic Sinhala...", flush=True)
              try:
                  with open(english_sub_file, "r", encoding="utf-8", errors="ignore") as ef:
                      raw_sub_content = ef.read()

                  blocks = [b.strip() for b in raw_sub_content.replace("\r\n", "\n").split("\n\n") if b.strip()]
                  total_blocks = len(blocks)
                  print(f"📊 Found {total_blocks} subtitle cues to translate into Cinematic Sinhala.", flush=True)

                  chunk_size = 75
                  translated_blocks = []

                  for c_idx in range(0, total_blocks, chunk_size):
                      chunk = blocks[c_idx:c_idx + chunk_size]
                      chunk_text = "\n\n".join(chunk)
                      c_num = (c_idx // chunk_size) + 1
                      tot_c = (total_blocks + chunk_size - 1) // chunk_size
                      print(f"🔄 Translating batch {c_num}/{tot_c} (cues {c_idx+1}-{min(c_idx+chunk_size, total_blocks)})...", end="", flush=True)

                      prompt = (
                          "You are an elite cinematic movie subtitle translator and dialog director for Sinhala cinema.\n"
                          "Translate the following English movie subtitle cues into natural, emotional, dramatic, and expressive spoken Sinhala (සිනමාරූපී චිත්‍රපට දෙබස් ශෛලිය).\n\n"
                          "CRITICAL RULES:\n"
                          "1. Output MUST be valid SRT format with the EXACT same numbering and timestamps as given.\n"
                          "2. Do NOT do literal word-by-word Google-translate style translation. Use conversational spoken Sinhala (කතා බහ කරන චතුර, හැඟීම්බර සිනමා දෙබස්).\n"
                          "3. Do not include markdown codeblocks, notes, or explanations. Output ONLY the valid SRT cues.\n\n"
                          "Subtitles to translate:\n"
                          f"{chunk_text}"
                      )

                      trans_chunk = ""
                      # Confirmed working models on this API endpoint with independent rate limit pools
                      models_to_try = [
                          "gemini-3.5-flash",
                          "gemini-3.1-flash-lite",
                          "gemini-3.5-flash-lite",
                          "gemini-3.5-flash",
                          "gemini-3.1-flash-lite",
                          "gemini-2.5-flash"
                      ]

                      for attempt in range(len(models_to_try)):
                          model_name = models_to_try[attempt]
                          try:
                              g_url = f"https://generativelanguage.googleapis.com/v1beta/models/{model_name}:generateContent?key={GEMINI_API_KEY}"
                              gen_cfg = {"temperature": 0.2}
                              if "2.5" in model_name:
                                  gen_cfg["thinkingConfig"] = {"thinkingBudget": 0}
                              payload = {
                                  "contents": [{"parts": [{"text": prompt}]}],
                                  "generationConfig": gen_cfg
                              }
                              g_res = requests.post(g_url, json=payload, headers={"Content-Type": "application/json"}, timeout=90)
                              if g_res.status_code == 200:
                                  g_data = g_res.json()
                                  candidates = g_data.get("candidates", [])
                                  if candidates:
                                      part_text = candidates[0].get("content", {}).get("parts", [{}])[0].get("text", "")
                                      part_text = re.sub(r"^```[a-zA-Z]*\n", "", part_text.strip())
                                      part_text = re.sub(r"\n```$", "", part_text.strip())
                                      if part_text and len(part_text) > 20:
                                          trans_chunk = part_text
                                          break
                              elif g_res.status_code == 429:
                                  cooldown = 15
                                  print(f"[RateLimit 429 - waiting {cooldown}s...]", end="", flush=True)
                                  time.sleep(cooldown)
                              elif g_res.status_code == 503:
                                  print(f"[Busy 503 - waiting 8s...]", end="", flush=True)
                                  time.sleep(8)
                              else:
                                  print(f"[{model_name} HTTP {g_res.status_code}]", end="", flush=True)
                          except Exception as ce:
                              print(f"[{model_name} Retry {attempt+1}: {type(ce).__name__}]", end="", flush=True)
                          time.sleep(3)

                      if trans_chunk:
                          translated_blocks.append(trans_chunk)
                          print(" ✅", flush=True)
                      else:
                          translated_blocks.append(chunk_text)
                          print(" ⚠️ (fallback)", flush=True)

                      # Safe 4-second pacing between batches to respect 15 RPM quota
                      time.sleep(4)

                  if translated_blocks:
                      cinematic_sub_path = f"{work_dir}/sinhala_cinematic_sub.srt"
                      with open(cinematic_sub_path, "w", encoding="utf-8") as out_sf:
                          out_sf.write("\n\n".join(translated_blocks) + "\n")

                      if os.path.exists(cinematic_sub_path) and os.path.getsize(cinematic_sub_path) > 100:
                          subtitle_file = cinematic_sub_path
                          print(f"🎬 [SUCCESS] Cinematic Sinhala Subtitles created successfully ({os.path.getsize(subtitle_file)/1024:.1f} KB)!", flush=True)
              except Exception as gem_e:
                  print(f"⚠️ Gemini translation warning: {gem_e}", flush=True)

          # 🎯 3. Smart Video Optimization
          optimized_video = f"{work_dir}/cinestream_final.mp4"

          print("\n🔍 Analyzing video codecs with ffprobe...", flush=True)
          probe_cmd = [
              "ffprobe", "-v", "error",
              "-show_entries", "stream=index,codec_type,codec_name,channels",
              "-of", "json", input_video
          ]
          probe_res = subprocess.run(probe_cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
          video_codec = ""
          audio_codec = ""
          audio_channels = 2
          try:
              data = json.loads(probe_res.stdout)
              for s in data.get("streams", []):
                  if s.get("codec_type") == "video" and not video_codec:
                      video_codec = s.get("codec_name", "").lower()
                  elif s.get("codec_type") == "audio" and not audio_codec:
                      audio_codec = s.get("codec_name", "").lower()
                      if s.get("channels"):
                          try:
                              audio_channels = int(s.get("channels"))
                          except Exception:
                              pass
          except Exception as pe:
              print(f"ffprobe warning: {pe}")

          print(f"📊 Detected -> Video: [{video_codec}], Audio: [{audio_codec}] ({audio_channels} Channels)", flush=True)

          is_v_supported = video_codec in ["h264", "avc1", "hevc", "h265"]
          is_a_aac_stereo = (audio_codec in ["aac", "mp3"]) and (audio_channels <= 2)

          ffmpeg_cmd = ["ffmpeg", "-y", "-i", input_video]

          sub_args = []
          if subtitle_file and os.path.exists(subtitle_file):
              ffmpeg_cmd.extend(["-i", subtitle_file])
              sub_args = [
                  "-c:s", "mov_text",
                  "-metadata:s:s:0", "language=sin",
                  "-metadata:s:s:0", "title=Sinhala",
                  "-map", "0:v:0",
                  "-map", "0:a:0",
                  "-map", "1:s:0"
              ]
          else:
              sub_args = ["-map", "0:v:0", "-map", "0:a:0?"]

          # Condition 1: Already H.264 or HEVC + 2-Channel Stereo AAC + Under 2000MB -> Instant Stream Copy (15 seconds!)
          if is_v_supported and is_a_aac_stereo and input_video.endswith(".mp4") and not subtitle_file and orig_size_mb <= 2000:
              print("⚡ [STREAM COPY]: Video is already H.264/HEVC + Stereo AAC! Instant copy...", flush=True)
              ffmpeg_cmd.extend(["-c", "copy", "-movflags", "+faststart", optimized_video])
          
          # Condition 2: Video is H.264 or HEVC (x265), but Audio has 5.1/7.1 or non-AAC -> Copy video (instant 20s!), convert audio to 2-Channel Stereo AAC
          elif is_v_supported and orig_size_mb <= 2000:
              print(f"⚡ [HIGH-SPEED STREAM COPY]: Video is {video_codec}! Copying video directly (0 quality loss, 20s speed), downmixing Audio to 2-Channel Stereo AAC (-ac 2)...", flush=True)
              ffmpeg_cmd.extend(["-c:v", "copy"])
              if is_a_aac_stereo:
                  ffmpeg_cmd.extend(["-c:a", "copy"])
              else:
                  ffmpeg_cmd.extend(["-c:a", "aac", "-b:a", "160k", "-ac", "2"])
              ffmpeg_cmd.extend(sub_args)
              ffmpeg_cmd.extend(["-movflags", "+faststart", optimized_video])
          
          # Condition 3: Full Re-encode (files > 2000MB or unsupported codecs) -> Fast 1080p Re-encode (veryfast)
          else:
              print("🎬 [TURBO BITRATE RE-ENCODE]: Re-encoding to H.264 with veryfast preset + Standard 2-Channel Stereo AAC...", flush=True)
              ffmpeg_cmd.extend([
                  "-c:v", "libx264",
                  "-preset", "veryfast",
                  "-crf", "23",
                  "-maxrate", "2200k",
                  "-bufsize", "4400k",
                  "-c:a", "aac",
                  "-b:a", "128k",
                  "-ac", "2"
              ])
              ffmpeg_cmd.extend(sub_args)
              ffmpeg_cmd.extend(["-movflags", "+faststart", optimized_video])

          print(f"▶️ Running FFmpeg Optimization...", flush=True)
          ret = subprocess.run(ffmpeg_cmd)

          final_upload_file = optimized_video if (ret.returncode == 0 and os.path.exists(optimized_video)) else input_video
          final_size_mb = os.path.getsize(final_upload_file) / (1024 * 1024)
          print(f"\n✅ Ready for Upload! Final File Size: {final_size_mb:.2f} MB", flush=True)

          # 🎯 4. Upload directly to Telegram Channel via Telethon
          async def upload_to_telegram():
              print("\n🚀 Connecting to Telegram MTProto API...", flush=True)
              client = TelegramClient(
                  'gh_cloud_session',
