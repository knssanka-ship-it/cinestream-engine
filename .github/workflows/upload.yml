                      print(f"🧠 Loading Faster-Whisper AI model (Audio length: {len(audio_np)/16000:.1f}s)...", flush=True)
                      # Multilingual tiny model supports English, Hindi, Telugu, Tamil, Korean, etc.
                      model = WhisperModel("tiny", device="cpu", compute_type="int8", cpu_threads=4)
                      
                      # 🎙️ Silero VAD (Voice Activity Detection):
                      # Only captures real human dialogue. Skips silence, background music, explosions, and ambient noises.
                      # condition_on_previous_text=False completely prevents infinite loop hallucinations.
                      segments, info = model.transcribe(
